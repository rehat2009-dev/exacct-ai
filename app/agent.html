<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expecct Agent</title>
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0d0d0f;--side:#111113;--panel:#161618;--panel2:#1c1c1f;--hover:#222226;
  --fg:#ececee;--fg2:#a1a1a8;--fg3:#6b6b73;--line:#232327;--line2:#2e2e33;
  --accent:#8b5cf6;--add:#3fb950;--addbg:rgba(63,185,80,.12);--del:#f85149;--delbg:rgba(248,81,73,.12);--warn:#d29922;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
svg{width:15px;height:15px;flex:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a2f;border-radius:10px;border:3px solid var(--bg)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

.app{display:flex;height:100vh}
/* ----- sidebar: tasks ----- */
.side{width:232px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .top{padding:12px 10px 8px;display:flex;flex-direction:column;gap:6px}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);font-weight:600;transition:background .15s}
.nb:hover{background:var(--hover)}
.nb kbd{margin-left:auto;font:11px var(--mono);color:var(--fg3)}
.sl{padding:10px 14px 4px;font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.tasks{flex:1;overflow:auto;padding:0 6px 10px}
.ti{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:7px;color:var(--fg2);transition:background .12s}
.ti:hover{background:var(--hover);color:var(--fg)}
.ti.on{background:var(--panel2);color:var(--fg)}
.ti .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .tm{font-size:11px;color:var(--fg3)}
.ti .live{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.side .foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.proj{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;transition:background .15s}
.proj:hover{background:var(--hover)}
.proj .pi{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--fg2)}
.proj .pt{flex:1;min-width:0}
.proj .pt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pt small{display:block;color:var(--fg3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj.none .pi{border-color:var(--accent);color:var(--accent)}

/* ----- main ----- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.head .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--fg2);transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--fg)}
.menu-btn{display:none}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:760px;margin:0 auto;padding:22px 22px 30px}

/* empty state */
.empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:680px;margin:0 auto;padding:28px 22px;gap:18px;animation:in .3s ease both}
.empty h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.empty h1 span{color:var(--fg3)}
.sug{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sg{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--fg2);transition:color .15s,padding .2s}
.sg:hover{color:var(--fg);padding-left:8px}
.sg svg{color:var(--fg3)}

/* thread */
.msg{margin:0 0 18px;animation:in .25s ease both}
.you{display:flex;justify-content:flex-end}
.you div{max-width:80%;background:var(--panel2);border:1px solid var(--line2);padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.say{color:var(--fg);line-height:1.65;overflow-wrap:anywhere}
.say p{margin:0 0 8px}.say>*:last-child{margin-bottom:0}
.say ul,.say ol{margin:0 0 8px;padding-left:20px}
.say h3{font-size:14px;margin:12px 0 4px}
.say code{font:12.5px var(--mono);background:var(--panel2);border:1px solid var(--line);padding:0 5px;border-radius:5px}
.say pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto}
.say pre code{background:none;border:0;padding:0}
.say.err{color:var(--del)}
.work{border-left:1px solid var(--line2);margin:0 0 16px 6px;padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:2px}
.st{animation:in .2s ease both}
.sr{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 6px;margin-left:-6px;border-radius:6px;color:var(--fg2);font-size:13px}
.sr:hover{background:var(--hover);color:var(--fg)}
.sr .k{font-weight:500;flex:none}
.sr .v{flex:1;min-width:0;font:12.5px var(--mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .ad{font:11.5px var(--mono);flex:none}.ad .a{color:var(--add)}.ad .d{color:var(--del);margin-left:5px}
.sr .s{flex:none;width:14px;height:14px;display:grid;place-items:center}
.sr .s svg{width:13px;height:13px}
.st.ok .s{color:var(--fg3)}.st.bad .s{color:var(--del)}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line2);border-top-color:var(--fg);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sd{margin:4px 0 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.sd pre{margin:0;padding:9px 11px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--fg2);max-height:320px;overflow:auto}
.diff{font:12px/1.6 var(--mono);max-height:360px;overflow:auto}
.diff div{padding:0 11px;white-space:pre-wrap;word-break:break-word}
.diff .a{background:var(--addbg);color:#aff5b4}.diff .d{background:var(--delbg);color:#ffc1bc}
.diff .h{color:var(--fg3);padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.thinking{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:12.5px;margin:0 0 16px 6px}
.shine{background:linear-gradient(90deg,var(--fg3) 30%,var(--fg) 50%,var(--fg3) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.changes{border:1px solid var(--line2);border-radius:10px;background:var(--panel);margin:0 0 18px;overflow:hidden;animation:in .25s ease both}
.ch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600}
.ch .sp{flex:1}
.ch button{padding:4px 10px;border-radius:6px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--fg2)}
.ch button:hover{color:var(--fg);background:var(--hover)}
.cf{display:flex;align-items:center;gap:8px;padding:6px 12px;font:12.5px var(--mono);color:var(--fg2)}
.cf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* composer */
.comp{flex:none;padding:0 22px 16px}
.cbox{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;transition:border-color .2s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.cbox:focus-within{border-color:#45454d}
.cbox textarea{display:block;width:100%;min-height:52px;max-height:220px;resize:none;background:transparent;border:0;outline:none;padding:13px 14px 4px;font-size:14px;line-height:1.5}
.cbox textarea::placeholder{color:var(--fg3)}
.cr{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;color:var(--fg2);font-size:12.5px;font-weight:500;transition:background .15s,color .15s;max-width:220px}
.chip:hover{background:var(--hover);color:var(--fg)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg{width:13px;height:13px}
.grow{flex:1}
.pop{position:absolute;bottom:calc(100% + 6px);left:0;min-width:240px;max-height:min(420px,70vh);overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:20;animation:in .15s ease both}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:7px;color:var(--fg2)}
.pop button:hover{background:var(--hover);color:var(--fg)}
.pop button.on{color:var(--fg)}
.pop button .ck{margin-left:auto;opacity:0}.pop button.on .ck{opacity:1}
.pop small{display:block;color:var(--fg3);font-size:11.5px}
.rel{position:relative}
.send{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fg);color:#0d0d0f;transition:opacity .15s,transform .15s}
.send:disabled{opacity:.3;cursor:default}
.send:not(:disabled):hover{transform:scale(1.05)}
.send svg{width:14px;height:14px}
.note{max-width:760px;margin:6px auto 0;text-align:center;color:var(--fg3);font-size:11.5px}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,8px);background:var(--fg);color:#0d0d0f;font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:8px;opacity:0;transition:all .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.sheet>div{width:min(380px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;animation:in .2s ease both}
.sheet h2{margin:0;font-size:16px;font-weight:600}
.sheet p{margin:0 0 4px;color:var(--fg2)}
.bt{width:100%;padding:10px;border-radius:9px;background:var(--fg);color:#0d0d0f;font-weight:600}
.bt.gh{background:transparent;color:var(--fg2);border:1px solid var(--line2)}
.noapp{height:100vh;display:grid;place-items:center;text-align:center;color:var(--fg2);padding:20px}
.noapp a{color:var(--fg)}
.scrim{display:none}
@media (max-width:720px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4)}
  .menu-btn{display:grid}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="top">
      <button class="nb" id="newTask"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L7 11H5V9z"/><path d="M13 9v3.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1H7"/></svg>New task<kbd id="kNew"></kbd></button>
    </div>
    <div class="sl">Tasks</div>
    <div class="tasks" id="tasks"></div>
    <div class="foot">
      <button class="proj" id="folder" title="Choose the folder the agent works in"><span class="pi"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.8 4.2a1 1 0 0 1 1-1h3.4l1.4 1.6h5.6a1 1 0 0 1 1 1v6.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/></svg></span><span class="pt"><b id="folderN">Choose project</b><small id="folderP">No folder yet</small></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="head">
      <button class="ib menu-btn" id="menu" title="Tasks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
      <div class="ttl" id="ttl">New task</div>
      <button class="ib" id="openFolder" title="Open the project folder"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg></button>
    </div>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <h1>What should we build<span id="inProj"></span>?</h1>
        <div class="sug" id="ideas"></div>
      </div>
      <div class="col" id="log" hidden></div>
    </div>

    <div class="comp">
      <div class="cbox">
        <textarea id="q" placeholder="Ask the agent to build, fix or explain something" rows="2"></textarea>
        <div class="cr">
          <div class="rel"><button class="chip" id="modelBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg><span id="modelT">Claude</span></button><div class="pop" id="modelPop" hidden></div></div>
          <div class="rel"><button class="chip" id="runBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="m4.5 6.5 2 1.8-2 1.8M8.5 10.5h3"/></svg><span id="runT">Ask before commands</span></button><div class="pop" id="runPop" hidden></div></div>
          <span class="grow"></span>
          <button class="send" id="go" aria-label="Send"></button>
        </div>
      </div>
      <div class="note">Files change only inside your project folder · Undo is always there</div>
    </div>
  </main>
</div>

<div class="sheet" id="loginSheet" hidden><div>
  <h2>Log in once</h2>
  <p>The agent uses the same login as Chat. Your browser opens, you log in, and you come right back.</p>
  <button class="bt" id="loginBrowser">Log in with browser</button>
  <button class="bt gh" id="loginHere">Log in here instead</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://js.puter.com/v2/"></script>
<script>
function $(id){ return document.getElementById(id); }
function each(sel,fn){ Array.prototype.forEach.call(document.querySelectorAll(sel),fn); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem("expecct.agent."+k)); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem("expecct.agent."+k,JSON.stringify(v)); }catch(e){} }
var tt; function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){ e.classList.remove("show"); },2400); }
var D = window.expecctDesktop;
if (!D || !D.agent) {
  document.body.innerHTML = "<div class=\"noapp\"><div><h2 style=\"color:#fff;font-weight:600\">The agent lives in the Expecct app</h2><p>It needs your computer to make files and run commands.<br><br><a href=\"../#download\">Download Expecct</a> &nbsp;·&nbsp; <a href=\"./\">Use the chat here</a></p></div></div>";
  throw new Error("not in app");
}
var A = D.agent, isMac = /Mac/.test(navigator.platform);
$("kNew").textContent = isMac ? "⌘N" : "Ctrl N";

/* ---------- icons ---------- */
var SVG = function(p,w){ return "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\""+(w||1.7)+"\" stroke-linecap=\"round\" stroke-linejoin=\"round\">"+p+"</svg>"; };
var I = {
  ok: SVG("<path d=\"m3.5 8.5 3 3 6-7\"/>",1.9), bad: SVG("<path d=\"m4 4 8 8M12 4l-8 8\"/>",1.9),
  send: SVG("<path d=\"M8 13V3M3.5 7.5 8 3l4.5 4.5\"/>",2), stop: "<svg viewBox=\"0 0 16 16\"><rect x=\"4\" y=\"4\" width=\"8\" height=\"8\" rx=\"1.5\" fill=\"currentColor\"/></svg>",
  arrow: SVG("<path d=\"M3 8h9.5M8.5 3.5 13 8l-4.5 4.5\"/>"), check: SVG("<path d=\"m3.5 8.5 3 3 6-7\"/>",1.9),
  file: SVG("<path d=\"M4 1.8h5.5L12.5 5v9.2H4z\"/>")
};

/* ---------- tools the AI can use ---------- */
function fn(name, desc, props, req){ return { type:"function", function:{ name:name, description:desc, parameters:{ type:"object", properties:props, required:req||[] } } }; }
var S = { type:"string" };
var TOOLS = [
  fn("list_dir","List files and folders. Path is relative to the project folder, or absolute to look elsewhere on the computer.",{ path:{ type:"string", description:"Folder path. Use \".\" for the project folder." } },["path"]),
  fn("read_file","Read a text file. Returns up to ~80 KB.",{ path:S },["path"]),
  fn("search_files","Search text in files under a folder (regex, case-insensitive). Skips node_modules and .git.",{ pattern:S, path:{ type:"string", description:"Folder to search, default the project folder." } },["pattern"]),
  fn("write_file","Create or overwrite a file inside the project folder. Makes folders as needed.",{ path:S, content:S },["path","content"]),
  fn("edit_file","Replace text in a file inside the project folder. old_text must appear exactly once.",{ path:S, old_text:S, new_text:S },["path","old_text","new_text"]),
  fn("run_command","Run a shell command in the project folder (cmd.exe on Windows, zsh/sh on Mac/Linux). Returns exit code and output. Use for building, testing, running Blender headless, git, npm, python etc.",{ command:S, timeout_seconds:{ type:"number", description:"Default 120, max 900." } },["command"]),
  fn("open_path","Open a file, folder or app on the user's computer with its normal program (for example open a .blend file in Blender or a .rbxl in Roblox Studio).",{ path:S },["path"])
];
var VERB = { list_dir:"Explored", read_file:"Read", search_files:"Searched", write_file:"Wrote", edit_file:"Edited", run_command:"Ran", open_path:"Opened" };
function target(name,a){ a=a||{}; return name==="run_command" ? a.command : name==="search_files" ? a.pattern : (a.path || "."); }
function lines(t){ return t ? String(t).replace(/\n$/,"").split("\n") : []; }
function diffOf(name,a){
  if (name==="edit_file") return { del:lines(a.old_text), add:lines(a.new_text) };
  if (name==="write_file") return { del:[], add:lines(a.content) };
  return null;
}
function diffHtml(d){
  var out=[], cap=400;
  d.del.slice(0,cap).forEach(function(l){ out.push("<div class=\"d\">- "+esc(l)+"</div>"); });
  d.add.slice(0,cap).forEach(function(l){ out.push("<div class=\"a\">+ "+esc(l)+"</div>"); });
  if (d.add.length>cap || d.del.length>cap) out.push("<div class=\"h\">… more lines</div>");
  return "<div class=\"diff\">"+out.join("")+"</div>";
}

/* ---------- models ---------- */
var CHOICES = [["claude","Claude","Best for code",/claude-sonnet-5-5|claude-sonnet-5|claude-opus-5/i],["chatgpt","ChatGPT","Fast and broad",/gpt-6-astra|gpt-6|gpt-5\.4|gpt-5/i],["gemini","Gemini","Big files",/gemini-4-argon|gemini-3\.8-flash|gemini-4/i]];
var pick = load("model","claude"), exact = load("exact",""), modelId = {}, ready = null, catalog = [];
var GROUP = [["chatgpt","OpenAI",/(^|\/)(gpt|o\d)/i],["claude","Anthropic",/claude/i],["gemini","Google",/gemini/i]];
var BAD = /image|audio|tts|realtime|transcri|embed|search|banana|vision-preview|omni|codex|:flex|:priority/i;
function tier(m){ var c=m.cost&&m.cost.input; if (c==null) return ""; return c<100?"$":c<500?"$$":"$$$"; }
function nice(m){ return m.name || String(m.id).split("/").pop().replace(/-/g," ").replace(/\b(gpt|claude|gemini)\b/i,function(x){ return {gpt:"GPT",claude:"Claude",gemini:"Gemini"}[x.toLowerCase()]; }); }
function resolve(){
  if (ready) return ready;
  ready = Promise.resolve().then(function(){ return puter.ai.listModels(); }).then(function(list){
    list=(list||[]).slice().sort(function(x,y){ return (String(x.id).indexOf(":")>=0)-(String(y.id).indexOf(":")>=0); });
    CHOICES.forEach(function(c){
      var srcs=String(c[3].source).split("|");
      for (var i=0;i<srcs.length && !modelId[c[0]];i++){ var re=new RegExp("(^|/)"+srcs[i]+"$","i"); var m=list.filter(function(x){ return re.test(x.id); })[0]; if (m) modelId[c[0]]=m.id; }
    });
    // every model you can use, grouped by company (direct models only, no image/audio ones)
    var seen={};
    catalog = GROUP.map(function(g){
      return { id:g[0], label:g[1], models:list.filter(function(m){ var id=String(m.id); if (id.indexOf(":")>=0 || BAD.test(id) || !g[2].test(id) || seen[id]) return false; seen[id]=1; return true; })
        .sort(function(a,b){ return String(b.id).localeCompare(String(a.id),undefined,{ numeric:true }); }).slice(0,10) };
    }).filter(function(g){ return g.models.length; });
    drawModel();
  }).catch(function(){});
  return ready;
}
function closePops(){ $("modelPop").hidden=true; $("runPop").hidden=true; }
document.addEventListener("click",function(e){ if (!e.target.closest(".rel")) closePops(); });
function currentModel(){ return exact || modelId[pick]; }
function drawModel(){
  var c=CHOICES.filter(function(x){ return x[0]===pick; })[0]||CHOICES[0], ex=null;
  catalog.forEach(function(g){ g.models.forEach(function(m){ if (m.id===exact) ex=m; }); });
  $("modelT").textContent = ex ? nice(ex) : c[1];
  var h = "<div style=\"padding:6px 9px 4px;color:var(--fg3);font-size:11px\">Quick pick</div>" +
    CHOICES.map(function(x){ return "<button class=\""+(!exact&&x[0]===pick?"on":"")+"\" data-m=\""+x[0]+"\"><span>"+x[1]+"<small>"+x[2]+"</small></span><span class=\"ck\">"+I.check+"</span></button>"; }).join("");
  catalog.forEach(function(g){
    h += "<div style=\"padding:8px 9px 4px;color:var(--fg3);font-size:11px;border-top:1px solid var(--line);margin-top:4px\">"+g.label+"</div>" +
      g.models.map(function(m){ return "<button class=\""+(exact===m.id?"on":"")+"\" data-x=\""+esc(m.id)+"\"><span>"+esc(nice(m))+"<small>"+esc(m.id)+(tier(m)?" · "+tier(m):"")+"</small></span><span class=\"ck\">"+I.check+"</span></button>"; }).join("");
  });
  if (!catalog.length) h += "<div style=\"padding:8px 9px;color:var(--fg3);font-size:11.5px\">Log in to see every model you can use</div>";
  h += "<div style=\"padding:8px 9px 4px;color:var(--fg3);font-size:11px;border-top:1px solid var(--line);margin-top:4px\">$ cheap · $$$ uses your free credit faster</div>";
  $("modelPop").innerHTML=h;
  each("[data-m]",function(b){ b.onclick=function(){ pick=b.dataset.m; exact=""; save("model",pick); save("exact",""); drawModel(); closePops(); }; });
  each("[data-x]",function(b){ b.onclick=function(){ exact=b.dataset.x; save("exact",exact); drawModel(); closePops(); }; });
}
$("modelBtn").onclick=function(){ var h=$("modelPop").hidden; closePops(); $("modelPop").hidden=!h; if (h && !catalog.length && window.puter) resolve(); };
var autoRun=false;
function drawRun(){
  $("runT").textContent = autoRun ? "Run commands by itself" : "Ask before commands";
  $("runPop").innerHTML = "<button class=\""+(!autoRun?"on":"")+"\" data-r=\"0\"><span>Ask before commands<small>You press Allow each time</small></span><span class=\"ck\">"+I.check+"</span></button>"+
    "<button class=\""+(autoRun?"on":"")+"\" data-r=\"1\"><span>Run by itself<small>Full access – like Codex auto mode</small></span><span class=\"ck\">"+I.check+"</span></button>";
  each("[data-r]",function(b){ b.onclick=function(){ closePops(); var on=b.dataset.r==="1"; A.setAutoRun(on).then(function(v){ autoRun=!!v; drawRun(); }); }; });
}
$("runBtn").onclick=function(){ var h=$("runPop").hidden; closePops(); $("runPop").hidden=!h; };

/* ---------- markdown (short) ---------- */
function md(src){
  return String(src).split("```").map(function(p,i){
    if (i%2){ var nl=p.indexOf("\n"); var code=nl>=0&&/^[\w+#.-]*$/.test(p.slice(0,nl))?p.slice(nl+1):p; return "<pre><code>"+esc(code.replace(/\n$/,""))+"</code></pre>"; }
    var out="", list=null;
    p.split("\n").forEach(function(l){
      var t=esc(l).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"), m;
      if ((m=l.match(/^\s*([-*]|\d+[.)])\s+/))){ var k=/\d/.test(m[1])?"ol":"ul"; if (list!==k){ if (list) out+="</"+list+">"; out+="<"+k+">"; list=k; } out+="<li>"+t.replace(/^\s*([-*]|\d+[.)])\s+/,"")+"</li>"; return; }
      if (list){ out+="</"+list+">"; list=null; }
      if (/^#{1,6}\s/.test(l)) out+="<h3>"+t.replace(/^#{1,6}\s+/,"")+"</h3>"; else if (l.trim()) out+="<p>"+t+"</p>";
    });
    if (list) out+="</"+list+">";
    return out;
  }).join("");
}

/* ---------- tasks ---------- */
// task = { id, title, at, items:[{t:"you"|"say"|"err"|"step"|"changes", ...}], hist:[chat messages for the AI] }
var tasks = load("tasks",[]), cur = null, running = null, info = { platform:"", home:"", workspace:"" };
function saveTasks(){ save("tasks", tasks.slice(0,40).map(function(t){ return { id:t.id, title:t.title, at:t.at, items:t.items.slice(-200), hist:t.hist.slice(-40) }; })); }
function ago(ms){ var s=(Date.now()-ms)/1000; return s<60?"now":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d"; }
function drawTasks(){
  $("tasks").innerHTML = tasks.length ? tasks.map(function(t){ return "<button class=\"ti"+(cur&&cur.id===t.id?" on":"")+"\" data-t=\""+t.id+"\">"+(running&&running.task===t?"<i class=\"live\"></i>":"")+"<span class=\"tt\">"+esc(t.title)+"</span><span class=\"tm\">"+ago(t.at)+"</span></button>"; }).join("")
    : "<div style=\"padding:6px 10px;color:var(--fg3);font-size:12.5px\">No tasks yet</div>";
  each("[data-t]",function(b){ b.onclick=function(){ openTask(tasks.filter(function(t){ return t.id===b.dataset.t; })[0]); $("app").classList.remove("open"); }; });
}
function openTask(t){
  cur=t||null;
  $("ttl").textContent = cur ? cur.title : "New task";
  $("empty").hidden = !!cur; $("log").hidden = !cur;
  $("log").innerHTML=""; work=null;
  if (cur) cur.items.forEach(function(it){ renderItem(it,true); });
  drawTasks(); drawGo(); scrollEnd(); $("q").focus();
}
function newTask(){ openTask(null); }
$("newTask").onclick=newTask;
document.addEventListener("keydown",function(e){ if ((isMac?e.metaKey:e.ctrlKey) && e.key.toLowerCase()==="n"){ e.preventDefault(); newTask(); } if (e.key==="Escape") closePops(); });
$("menu").onclick=function(){ $("app").classList.toggle("open"); };
$("scrim").onclick=function(){ $("app").classList.remove("open"); };

/* ---------- drawing the thread ---------- */
var work=null;
function scrollEnd(){ var s=$("scroll"); s.scrollTop=s.scrollHeight; }
function nearEnd(){ var s=$("scroll"); return s.scrollHeight-s.scrollTop-s.clientHeight<140; }
function el(cls,html){ var e=document.createElement("div"); e.className=cls; e.innerHTML=html||""; $("log").appendChild(e); return e; }
function renderItem(it){
  if (it.t!=="step") work=null;
  if (it.t==="you"){ var e=el("msg you","<div></div>"); e.firstChild.textContent=it.text; return e; }
  if (it.t==="say") return el("msg say",md(it.text));
  if (it.t==="err") return el("msg say err",esc(it.text));
  if (it.t==="changes") return changesEl(it);
  if (it.t==="step"){
    if (!work) work=el("work");
    var d = it.diff, ad = d ? "<span class=\"ad\">"+(d.add.length?"<span class=\"a\">+"+d.add.length+"</span>":"")+(d.del.length?"<span class=\"d\">−"+d.del.length+"</span>":"")+"</span>" : "";
    var s=document.createElement("div"); s.className="st "+(it.ok==null?"run":it.ok?"ok":"bad");
    s.innerHTML="<button class=\"sr\"><span class=\"k\">"+(VERB[it.name]||esc(it.name))+"</span><span class=\"v\">"+esc(String(it.target||"").slice(0,200))+"</span>"+ad+"<span class=\"s\">"+(it.ok==null?"<i class=\"spin\"></i>":it.ok?I.ok:I.bad)+"</span></button><div class=\"sd\" hidden></div>";
    s.querySelector(".sr").onclick=function(){
      var b=s.querySelector(".sd");
      if (b.hidden && !b.innerHTML) b.innerHTML = (d && it.ok ? diffHtml(d) : "") + (it.out && !(d && it.ok) ? "<pre>"+esc(it.out)+"</pre>" : "") || "<pre>…</pre>";
      b.hidden=!b.hidden;
    };
    work.appendChild(s); it._el=s; return s;
  }
}
function updateStep(it){
  var s=it._el; if (!s) return;
  s.className="st "+(it.ok?"ok":"bad");
  s.querySelector(".s").innerHTML = it.ok?I.ok:I.bad;
  var b=s.querySelector(".sd"); b.innerHTML="";
  if (!it.ok) { var ad=s.querySelector(".ad"); if (ad) ad.remove(); b.innerHTML="<pre>"+esc(it.out||"")+"</pre>"; b.hidden=false; }
}
function changesEl(it){
  var e=el("changes","<div class=\"ch\">"+I.file+"<span>"+it.files.length+" file"+(it.files.length>1?"s":"")+" changed</span><span class=\"sp\"></span>"+(it.undone?"<span style=\"color:var(--fg3);font-weight:500\">Undone</span>":"<button data-u>Undo</button>")+"<button data-o>Open folder</button></div>"+
    it.files.map(function(f){ return "<div class=\"cf\"><span>"+esc(f.path)+"</span><span class=\"ad\" style=\"flex:none\"><span class=\"a\">+"+f.add+"</span><span class=\"d\">−"+f.del+"</span></span></div>"; }).join(""));
  var u=e.querySelector("[data-u]");
  if (u) u.onclick=function(){ A.undo().then(function(n){ it.undone=true; saveTasks(); u.outerHTML="<span style=\"color:var(--fg3);font-weight:500\">Undone</span>"; toast(n?"Undid "+n+" change"+(n>1?"s":""):"Nothing to undo"); }); };
  e.querySelector("[data-o]").onclick=function(){ A.tool("open_path",{ path:"." }); };
  return e;
}
function push(it){ cur.items.push(it); var stick=nearEnd(); renderItem(it); if (stick) scrollEnd(); return it; }

/* ---------- project folder ---------- */
function drawFolder(){
  var w=info.workspace, name = w ? w.split(/[\\/]/).filter(Boolean).pop() : "";
  $("folderN").textContent = w ? name : "Choose project";
  $("folderP").textContent = w ? (w.length>34 ? "…"+w.slice(-33) : w) : "No folder yet";
  $("folder").classList.toggle("none",!w);
  $("inProj").textContent = w ? " in "+name : "";
}
function pickFolder(){ return A.pickFolder().then(function(w){ if (w){ info.workspace=w; drawFolder(); toast("Working in "+w.split(/[\\/]/).pop()); } return w; }); }
$("folder").onclick=pickFolder;
$("openFolder").onclick=function(){ if (!info.workspace){ pickFolder(); return; } A.tool("open_path",{ path:"." }); };

var IDEAS = [
  "Make a Roblox script that lets the player sprint with Shift",
  "Write a Blender script that builds a low-poly house and run it",
  "Explain how this project works",
  "Find and fix the errors in my code",
  "Make a small website and open it"
];
$("ideas").innerHTML=IDEAS.map(function(t,i){ return "<button class=\"sg\" data-i=\""+i+"\">"+I.arrow+"<span>"+esc(t)+"</span></button>"; }).join("");
each("[data-i]",function(b){ b.onclick=function(){ $("q").value=IDEAS[+b.dataset.i]; autosize(); $("q").focus(); }; });

/* ---------- composer ---------- */
function drawGo(){ var b=$("go"), busy=!!(running && cur && running.task===cur); b.innerHTML=busy?I.stop:I.send; b.disabled=!busy && !$("q").value.trim(); b.setAttribute("aria-label",busy?"Stop":"Send"); }
function autosize(){ var q=$("q"); if (!q.value){ q.style.height=""; } else { q.style.height="auto"; q.style.height=Math.min(220,q.scrollHeight)+"px"; } drawGo(); }
$("q").addEventListener("input",autosize);
$("q").addEventListener("keydown",function(e){ if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); go(); } });
$("go").onclick=go;

function system(){
  return "You are Expecct Agent, a coding agent like Codex running inside the Expecct desktop app on the user's own computer.\n" +
    "Computer: " + info.platform + ". Home folder: " + info.home + ". Project folder: " + (info.workspace || "(none chosen yet)") + ".\n" +
    "Tools: list_dir, read_file, search_files (read anywhere), write_file and edit_file (only inside the project folder), run_command (shell in the project folder; the user may need to approve it), open_path.\n" +
    "How to work: explore first (list_dir, read_file), then make the change, then check it by running something when that makes sense. Prefer small, correct edits. Never delete the user's files unless asked. If a command fails, read the error and fix it.\n" +
    "Blender: run it headless with: blender --background --python script.py (Windows path is usually \"C:\\\\Program Files\\\\Blender Foundation\\\\Blender <version>\\\\blender.exe\", Mac: /Applications/Blender.app/Contents/MacOS/Blender). Save results as .blend files in the project folder.\n" +
    "Roblox: write Luau scripts as .luau files in the project (use Rojo if the project has default.project.json). Tell the user where each script goes in Roblox Studio (for example ServerScriptService or StarterPlayerScripts).\n" +
    "Answer in the same language the user writes in. Be short: say what you did and what to do next.";
}
function textOf(msg){
  if (!msg) return "";
  var c=msg.content;
  if (typeof c==="string") return c;
  if (Array.isArray(c)) return c.map(function(x){ return x && (x.text || (x.type==="text" && x.content)) || ""; }).join("");
  return "";
}
var pending=null;
function go(){
  if (running && cur && running.task===cur){ stop(); return; }
  if (running){ toast("Another task is still running"); return; }
  var t=$("q").value.trim(); if (!t) return;
  if (!window.puter){ toast("Couldn't load the AI – check your internet"); return; }
  if (puter.auth && !puter.auth.isSignedIn()){ pending=t; $("loginSheet").hidden=false; return; }
  if (!info.workspace){ pickFolder().then(function(w){ if (w) go(); }); return; }
  $("q").value=""; autosize();
  run(t);
}
function stop(){ if (!running) return; running.stopped=true; A.stop(); toast("Stopped"); }
async function run(t){
  if (!cur){ cur={ id:Date.now().toString(36), title:t.split("\n")[0].slice(0,70), at:Date.now(), items:[], hist:[] }; tasks.unshift(cur); openTask(cur); }
  var task=cur, job={ task:task, stopped:false }; running=job;
  cur.at=Date.now(); drawTasks(); drawGo();
  if (cur===task) push({ t:"you", text:t });
  task.hist.push({ role:"user", content:t });
  await resolve();
  var model=currentModel(), msgs=[{ role:"system", content:system() }].concat(task.hist.slice(-40)), changed={};
  var think=null;
  function showThink(on){ if (think){ think.remove(); think=null; } if (on && cur===task){ think=document.createElement("div"); think.className="thinking"; think.innerHTML="<i class=\"spin\"></i><span class=\"shine\">Working…</span>"; $("log").appendChild(think); if (nearEnd()) scrollEnd(); } }
  function add(it){ if (cur===task) return push(it); task.items.push(it); return it; }
  try {
    for (var round=0; round<40; round++){
      if (job.stopped) break;
      showThink(true);
      var opts={ tools:TOOLS }; if (model) opts.model=model;
      var res = await puter.ai.chat(msgs, false, opts);
      showThink(false);
      if (job.stopped) break;
      var msg = res && res.message ? res.message : { role:"assistant", content:String(res||"") };
      if (!msg.role) msg.role="assistant";
      msgs.push(msg);
      var text=textOf(msg).trim(), calls=msg.tool_calls||[];
      if (text) add({ t:"say", text:text });
      if (!calls.length){ task.hist.push({ role:"assistant", content:text || "Done." }); break; }
      for (var i=0;i<calls.length;i++){
        var c=calls[i], name=c.function && c.function.name, args={};
        try { args = typeof c.function.arguments==="string" ? JSON.parse(c.function.arguments||"{}") : (c.function.arguments||{}); } catch(e){}
        var it=add({ t:"step", name:name, target:target(name,args), diff:diffOf(name,args), ok:null }), out;
        try { out = await A.tool(name,args); } catch(e){ out={ ok:false, text:String(e && e.message || e) }; }
        out = out || { ok:false, text:"No answer from the app" };
        it.ok=!!out.ok; it.out=String(out.text||"").slice(0,6000);
        if (it.diff && !it.ok) it.diff=null;
        updateStep(it);
        if (out.ok && it.diff){ var f=changed[args.path]||(changed[args.path]={ path:args.path, add:0, del:0 }); f.add+=it.diff.add.length; f.del+=it.diff.del.length; }
        // keep big diffs out of storage
        if (it.diff && it.diff.add.length+it.diff.del.length>600) it.diff={ add:it.diff.add.slice(0,300), del:it.diff.del.slice(0,300) };
        msgs.push({ role:"tool", tool_call_id:c.id, content:String(out.text||"").slice(0,24000) });
        if (job.stopped) break;
      }
    }
  } catch(e){
    showThink(false);
    var m=(e && (e.message || (e.error && e.error.message))) || String(e);
    add({ t:"err", text: /insufficient|funds|credit|quota|limit/i.test(m) ? "Free AI usage is used up for now. Try again later or pick a cheaper model ($)." : /model|not found|permission|access|unauthori/i.test(m) ? "You can't use this model right now – pick another one in the model menu." : "Something went wrong: "+m.slice(0,200) });
  }
  showThink(false);
  var files=Object.keys(changed).map(function(k){ return changed[k]; });
  if (files.length) add({ t:"changes", files:files });
  if (job.stopped) add({ t:"err", text:"Stopped." });
  running=null; task.at=Date.now(); saveTasks(); drawTasks(); drawGo();
  if (cur===task && nearEnd()) scrollEnd();
}

/* ---------- login (same as Chat) ---------- */
$("loginBrowser").onclick=function(){ D.login(); toast("Finish logging in in your browser"); };
$("loginHere").onclick=function(){ puter.auth.signIn({ attempt_temp_user_creation:true }).then(loggedIn).catch(function(){}); };
$("loginSheet").onclick=function(e){ if (e.target.id==="loginSheet") $("loginSheet").hidden=true; };
function loggedIn(){ $("loginSheet").hidden=true; if (pending){ $("q").value=pending; pending=null; go(); } }
D.onToken(function(tok){ try { puter.setAuthToken(tok); toast("You're logged in"); ready=null; resolve(); loggedIn(); } catch(e){} });

/* ---------- start ---------- */
drawModel(); drawRun(); drawTasks(); drawGo();
if (window.puter && puter.auth && puter.auth.isSignedIn()) resolve();
A.info().then(function(i){ info=i||info; autoRun=!!info.autoRun; drawFolder(); drawRun(); });
openTask(tasks[0] && Date.now()-tasks[0].at<6*3600*1000 ? tasks[0] : null);
</script>
