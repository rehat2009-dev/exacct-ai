<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Exacct AI</title>
<style>
:root{--bg:#09090b;--bar:#111114;--fg:#f4f4f5;--muted:#8b8b94;--line:rgba(255,255,255,.08);--accent:#8b5cf6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
.bar{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;background:var(--bar);border-bottom:1px solid var(--line);-webkit-app-region:drag;position:relative}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.mac .bar{padding-left:84px}
.id{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.id img{width:22px;height:22px;border-radius:6px;flex:none}
.name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.btns{display:flex;gap:2px;-webkit-app-region:no-drag}
button{width:32px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
button:hover{background:rgba(255,255,255,.07);color:var(--fg)}
button:disabled{opacity:.3;pointer-events:none}
button.on{color:var(--accent)}
button svg{width:16px;height:16px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.close:hover{background:#e5484d;color:#fff}
.mac .winbtns{display:none!important}
@media (max-width:500px){.ai{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="id"><img id="icon" alt=""><span class="name" id="name">Exacct AI</span><span class="ai" id="ai"></span></div>
  <div class="btns">
    <button id="back" title="Back" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3 5 8l5 5"/></svg></button>
    <button id="home" title="New chat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="reload" title="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg></button>
    <button id="pin" title="Keep on top"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg></button>
    <button id="settings" title="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    <span class="winbtns" style="display:flex;gap:2px"><span class="sep"></span>
    <button id="min" title="Minimise"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
    <button id="max" title="Maximise"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></button>
    <button id="close" class="close" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></span>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
["back","home","reload","pin","settings","min","max","close"].forEach(id=>$(id).onclick=()=>exacct.win(id));
function show(c){
  document.body.classList.toggle("mac",c.isMac);
  document.documentElement.style.setProperty("--accent",c.accent);
  $("name").textContent=c.name; $("ai").textContent=c.aiLabel;
  $("icon").src=c.icon||"icon.png";
  $("pin").classList.toggle("on",c.alwaysOnTop);
  document.title=c.name;
}
exacct.get().then(show); exacct.onCfg(show);
exacct.onNav(n=>$("back").disabled=!n.canBack);
</script>
</body>
</html>
