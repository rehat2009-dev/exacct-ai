<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Expecct</title>
<style>
:root{--bg:#0a0a0d;--rail:#0f0f13;--panel:#111116;--card:#17171d;--card2:#1e1e26;--fg:#f2f2f5;--muted:#8a8a96;--line:rgba(255,255,255,.07);--accent:#8b5cf6;--pink:#ec4899;--gold:#d6a35c;--top:44px;--railw:68px}
@media (max-width:519px){:root{--railw:52px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{width:18px;height:18px;flex:none}

/* ===== top bar ===== */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;background:var(--rail);border-bottom:1px solid var(--line);-webkit-app-region:drag;z-index:20}
.t-aurora .top{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,var(--rail)),var(--rail) 45%)}
.t-midnight .top,.t-midnight .rail{background:#13112a}
.t-black .top,.t-black .rail{background:#000}
.mac .top{padding-left:84px}
.id{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.id img{width:22px;height:22px;border-radius:6px;flex:none}
.name{font-weight:800;font-size:13.5px;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.crumb i{width:7px;height:7px;border-radius:50%;flex:none}
.tools{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag}
.tb{width:34px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.tb:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.tb:disabled{opacity:.3;pointer-events:none}
.tb.on{color:var(--fg);background:color-mix(in srgb,var(--accent) 28%,transparent)}
.tb svg{width:16px;height:16px}
.newchat{display:flex;align-items:center;gap:6px;height:30px;border:0;border-radius:999px;padding:0 14px 0 11px;margin:0 4px;background:#fff;color:#0b0b0f;font-weight:700;font-size:12.5px;transition:transform .15s,box-shadow .2s}
.newchat:hover{box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.newchat:active{transform:scale(.95)}
.newchat svg{width:14px;height:14px}
.pill2{display:flex;align-items:center;gap:6px;height:30px;border-radius:999px;padding:0 13px;margin:0 2px;font-weight:700;font-size:12.5px;white-space:nowrap;border:1px solid rgba(255,255,255,.18);background:transparent;transition:background .15s,transform .15s}
.pill2:hover{background:rgba(255,255,255,.08)}
.pill2:active{transform:scale(.95)}
.pill2.up{border:0;background:linear-gradient(135deg,var(--accent),var(--pink));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.pill2 i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.find{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 2px 0 10px;height:32px;margin-right:4px;animation:up .2s ease both}
.find input{width:150px;border:0;background:none;outline:none;font-size:13px}
.find span{font-size:11.5px;color:var(--muted);min-width:34px;text-align:right;margin-right:2px}
.find .tb{width:26px;height:26px}
.ri .so{position:absolute;right:10px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--rail)}
.acc{display:flex;align-items:center;gap:10px;padding:8px 0}
.acc+.acc{border-top:1px solid var(--line)}
.acc .aic{opacity:1;width:28px;height:28px;font-size:10.5px}
.acc .an{flex:1;min-width:0;font-weight:700}
.acc .an small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.acc .an small.ok{color:#4ade80}
.ver{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media (max-width:700px){.pill2 span{display:none}.pill2{padding:0 10px}.find input{width:90px}}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tb.close:hover{background:#e5484d;color:#fff}
.mac .win{display:none!important}
.loadbar{position:fixed;top:calc(var(--top) - 2px);left:0;right:0;height:2px;z-index:21;overflow:hidden;opacity:0;transition:opacity .3s}
.loading .loadbar{opacity:1}
.loadbar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--accent),var(--pink),transparent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.toast{position:fixed;left:50%;top:7px;transform:translate(-50%,-60px);background:#fff;color:#0b0b0f;font-weight:700;font-size:12.5px;padding:7px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:30;white-space:nowrap;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
@media (max-width:700px){.crumb,.hs{display:none!important}}
@media (max-width:519px){.name{display:none}.newchat span{display:none}.newchat{padding:0 9px;margin:0 2px}.hm{display:none!important}}

/* ===== side rail ===== */
.rail{position:fixed;top:var(--top);left:0;bottom:0;width:var(--railw);background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;z-index:15;overflow:hidden}
.ri{position:relative;width:calc(var(--railw) - 12px);border:0;background:transparent;color:var(--muted);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s,color .15s}
.ri:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.ri span{font-size:10px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.ri.on{color:var(--fg);background:rgba(255,255,255,.08)}
.ri.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.aic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;color:#fff;background:var(--c);opacity:.55;transition:opacity .2s,transform .2s}
.aic.img{background:#fff;padding:5px}
.aic.img img{width:100%;height:100%;object-fit:contain;display:block}
.ri:hover .aic{opacity:.85}
.ri .aic.img{opacity:.8}
.ri.on .aic,.ri.vis .aic{opacity:1}
.ri.on .aic{transform:scale(1.06);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.ri.vis:not(.on)::after{content:"";position:absolute;right:9px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--fg)}
.chic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--pink));opacity:.6;transition:opacity .2s,transform .2s}
.chic svg{width:17px;height:17px}
.chic.ag{background:linear-gradient(135deg,#22d3ee,var(--accent))}
.ri:hover .chic{opacity:.9}
.ri.on .chic{opacity:1;transform:scale(1.06);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.chatmode #b-back,.chatmode #b-reload,.chatmode #b-signin,.chatmode #r-ask,.chatmode #b-new{display:none!important}
.ri.vis:not(.on)::after,.ri .so{display:none!important}
.rsep{width:28px;height:1px;background:var(--line);margin:6px 0}
.grow{flex:1}
.badge{position:absolute;right:8px;top:4px;min-width:16px;height:16px;border-radius:8px;padding:0 4px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
@media (max-width:519px),(max-height:620px){.ri span{display:none}.ri{padding:8px 0}}

/* ===== stage behind the AI ===== */
.stage{position:fixed;top:var(--top);left:var(--railw);right:0;bottom:0;display:grid;place-items:center}
.stage img{width:84px;height:84px;opacity:.45;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* ===== ask all + columns ===== */
.ask{position:fixed;top:var(--top);right:0;height:54px;z-index:9;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);animation:up .25s ease both}
.ask input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:none;font-weight:600}
.ask input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ask .go{border:0;border-radius:999px;padding:9px 16px;font-weight:800;background:#fff;color:#0b0b0f;white-space:nowrap}
.cols{position:fixed;left:0;right:0;height:30px;z-index:8}
.col{position:absolute;top:0;height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer}
.col.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.col i{width:8px;height:8px;border-radius:50%;flex:none}
.col .cy{margin-left:auto;border:0;background:rgba(255,255,255,.06);color:var(--fg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}

/* ===== panel ===== */
.panel{position:fixed;top:var(--top);left:var(--railw);bottom:0;width:340px;background:var(--panel);border-right:1px solid var(--line);z-index:12;display:flex;flex-direction:column;opacity:0;transform:translateX(-14px);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1);user-select:text}
.panel.open{opacity:1;transform:none;pointer-events:auto}
@media (max-width:727px){.panel{width:calc(100% - var(--railw))}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 18px}
.phead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.pbody{flex:1;overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:18px}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.sec{display:flex;flex-direction:column;gap:10px;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;transition:all .15s}
.chip:hover{border-color:rgba(255,255,255,.22)}
.chip.on,.chip.white{background:#fff;color:#0b0b0f;border-color:#fff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:#fff;color:#0b0b0f}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:80px}
.muted{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}

/* chats */
.stat{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bars{display:flex;align-items:flex-end;gap:5px;height:52px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:11px;border-radius:4px;background:var(--accent);min-height:3px}
.bars div:last-child i{background:linear-gradient(180deg,var(--pink),var(--accent))}
.bars span{font-size:9.5px;color:var(--muted)}
.splitbar{display:flex;height:6px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.06);margin-top:12px}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend b{width:8px;height:8px;border-radius:50%;display:inline-block}
.goal{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px}
.group{font-size:11px;color:var(--muted);font-weight:700;margin:6px 2px 2px}
.hitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:10px;transition:background .15s}
.hitem:hover{background:var(--card)}
.hitem .d{width:8px;height:8px;border-radius:50%;flex:none}
.hitem .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hitem .tm{font-size:11px;color:var(--muted);flex:none}
.hitem .pin,.hitem .x{opacity:0;color:var(--muted);padding:0 2px;font-size:14px}
.hitem:hover .pin,.hitem:hover .x,.hitem .pin.on{opacity:1}
.hitem .pin.on{color:var(--gold)}

/* prompts */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.pcard .pt{display:flex;align-items:center;gap:8px;font-weight:700}
.pcard .pt span{flex:1}
.pcard p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.use{border:0;border-radius:999px;padding:5px 13px;font-weight:800;font-size:12px;background:#fff;color:#0b0b0f}
.del{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.del:hover{color:#ff6b6b}

/* size */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 8px 7px;display:flex;flex-direction:column;align-items:stretch;gap:6px;transition:all .15s}
.tile:hover{border-color:rgba(255,255,255,.22)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scr{position:relative;aspect-ratio:16/10;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}
.scr i{position:absolute;border-radius:3px;background:var(--accent)}
.tile.on .scr i{background:linear-gradient(135deg,var(--accent),var(--pink))}
.tile span{font-size:11px;font-weight:700;text-align:center;color:#d4d4d8}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:140px;aspect-ratio:16/10;padding:6px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.pos button{border:1px dashed rgba(255,255,255,.12);border-radius:5px;background:transparent}
.pos button:hover{background:rgba(255,255,255,.07)}
.pos button.on{background:var(--accent);border:1px solid var(--accent)}
.wh{display:flex;gap:6px;align-items:center}
.wh input{width:80px}
.zoom{display:flex;align-items:center;gap:8px}
.zoom b{min-width:48px;text-align:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:5px 0}
.tg input{display:none}
.tg .k{width:38px;height:22px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tg .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg input:checked+.k{background:var(--accent);border-color:var(--accent)}
.tg input:checked+.k::after{transform:translateX(16px)}
.tg small{display:block;color:var(--muted);font-size:11.5px}

/* style */
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;transition:transform .15s}
.sw.on{border-color:#fff;transform:scale(1.15)}
.iconrow{display:flex;gap:14px;align-items:center}
canvas{width:72px;height:72px;flex:none}
.keys{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:12.5px;color:var(--muted)}
kbd{font:600 11px/1 system-ui,sans-serif;background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:4px 6px;color:var(--fg);white-space:nowrap}

/* ===== welcome ===== */
.welcome{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 30% 30%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),var(--bg);-webkit-app-region:drag}
.wbox{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;-webkit-app-region:no-drag}
.wbox h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wbox .hero{width:100px;height:100px;animation:float 3s ease-in-out infinite}
.wstep{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;animation:up .35s ease both}
.aipick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.aipick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;transition:all .2s}
.aipick button i{width:34px;height:34px;border-radius:11px;display:block}
.aipick button.on{border-color:#fff;background:var(--card2)}
.big-btn{border:0;border-radius:999px;padding:12px 28px;font-weight:800;font-size:15px;background:#fff;color:#0b0b0f}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.2);transition:all .3s}
.dots i.on{width:22px;background:#fff}
.link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.wtiles{width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.notice{position:fixed;right:0;height:52px;z-index:9;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);animation:up .25s ease both}
.notice .gl{width:26px;height:26px;border-radius:8px;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:900;flex:none}
.notice p{margin:0;flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.notice p b{display:block;font-size:13px}
.notice .go{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px;background:#fff;color:#0b0b0f;white-space:nowrap}
.notice .go2{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:12.5px;background:transparent;white-space:nowrap}
@media (max-width:620px){.notice p span{display:none}}
</style>
</head>
<body class="t-aurora">
<header class="top">
  <div class="id"><img id="icon" alt=""><span class="name" id="name">Expecct</span><span class="crumb" id="crumb"></span></div>
  <div class="tools">
    <div class="find" id="find" hidden><input id="findIn" placeholder="Find in page" autocomplete="off"><span id="findN"></span><button class="tb" id="f-prev" title="Previous (Shift + Enter)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4-4 4 4"/></svg></button><button class="tb" id="f-next" title="Next (Enter)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg></button><button class="tb" id="f-x" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
    <button class="pill2 up" id="b-update" hidden title="A new version is ready"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg><span id="b-updateT">Restart to update</span></button>
    <button class="pill2" id="b-signin" hidden title="Sign in"><i></i><span>Sign in</span></button>

<div class="stage"><img id="stageIcon" alt=""></div>
<form class="ask" id="ask" hidden><input id="askIn" placeholder="Ask ChatGPT, Claude and Gemini at once" autocomplete="off"><button class="go" type="submit">Ask all</button><button class="tb" type="button" id="askX" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></form>

<div class="notice" id="notice" hidden><i class="gl">!</i><p><b>Google doesn't allow sign-in inside apps</b><span id="noticeT"></span></p><button class="go2" id="noticeEmail" hidden>Use email</button><button class="go" id="noticeOpen">Open in browser window</button><button class="tb" id="noticeX" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>

  <div class="phead"><h2 id="ptitle">Chats</h2><button class="tb" id="p-close" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
  <div class="pbody" id="pbody"></div>

<div class="welcome" id="welcome" hidden><div class="wbox" id="wbox"></div></div>

<script>
var S = null, tab = "chats", open = false, q = "", armed = {}, askOpen = false, adding = false;
var COLS = { cols: [], top: 44, left: 68, focused: null };
var ic = { col: 0, shape: "Rounded", glyph: "" };
var TITLES = { chats: "Chats", prompts: "Prompts", layout: "Size", style: "Settings" };
var SHORT = { chatgpt: "Gp", claude: "Cl", gemini: "Ge" };
var COLORS = [["#8b5cf6","#ec4899"],["#10a37f","#0b6e56"],["#d97757","#b4533a"],["#4f8cff","#a855f7"],["#06b6d4","#2563eb"],["#f59e0b","#ef4444"],["#22c55e","#0ea5e9"],["#3f3f46","#09090b"],["#e11d48","#7c3aed"],["#eab308","#f97316"]];
var ACCENTS = ["#8b5cf6","#ec4899","#10a37f","#d97757","#4f8cff","#06b6d4","#f59e0b","#ef4444","#22c55e","#e4e4e7"];
var SHAPES = ["Rounded","Circle","Squircle","Diamond"];
var TILES = [["mini",[73,54,22,40]],["small",[36,19,28,62]],["medium",[26,14,48,72]],["large",[17,9,66,82]],["xl",[8,5,84,90]],["focus",[15,8,70,84]],["tall",[68,0,32,100]],["left",[0,0,50,100]],["right",[50,0,50,100]],["left3",[0,0,33,100]],["right3",[67,0,33,100]],["top",[0,0,100,50]],["bottom",[0,50,100,50]],["full",[0,0,100,100]]];
var POS = ["tl","tc","tr","ml","center","mr","bl","bc","br"];
var call = window.exacct.call;
function $(id){ return document.getElementById(id); }
function each(sel, root, fn){ Array.prototype.forEach.call((root || document).querySelectorAll(sel), fn); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function set(p){ return call("set", p).then(function(s){ S = s; render(); }); }
function iconSrc(){ return S.cfg.icon || "icon.png"; }
function aiOf(id){ return S.ais.filter(function(a){ return a.id === id; })[0] || S.ais[0]; }
function aicHtml(a){
  return a.icon ? "<i class=\"aic img\" style=\"--c:" + a.color + "\"><img src=\"" + esc(a.icon) + "\" alt=\"\"></i>"
                : "<i class=\"aic\" style=\"--c:" + a.color + "\">" + SHORT[a.id] + "</i>";
}
function mod(){ return S && S.isMac ? "⌘" : "Ctrl"; }

/* ---------- toast ---------- */
var tt;
function toast(t){ var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("show"); }, 1700); }

/* ---------- main render ---------- */
function render(){
  if (!S) return;
  var c = S.cfg, cur = S.focused || c.ai, vis = S.cols || [c.ai];
  document.documentElement.style.setProperty("--accent", c.accent);
  document.body.className = document.body.className.replace(/\bt-\w+/g, "").replace(/\bmac\b/, "").trim() + " t-" + c.theme + (S.isMac ? " mac" : "");
  $("name").textContent = c.name; document.title = c.name;
  $("icon").src = iconSrc(); $("stageIcon").src = iconSrc();
  var a = aiOf(cur);
  document.body.classList.toggle("chatmode", !!S.chatMode);
  $("crumb").innerHTML = S.chatMode ? (S.page === "agent" ? "Agent" : "Chat") : "<i style=\"background:" + a.color + "\"></i>" + esc(a.label);
  $("r-chat").classList.toggle("on", !!S.chatMode && S.page !== "agent");
  $("r-agent").classList.toggle("on", !!S.chatMode && S.page === "agent");
  $("b-mini").classList.toggle("on", !!c.mini);
  var list = $("aiList");
  if (!list.children.length) {
    S.ais.forEach(function(x, i){
      var b = document.createElement("button");
      b.className = "ri ai"; b.dataset.ai = x.id; b.title = x.label + " (" + mod() + " " + (i + 1) + ")";
      b.innerHTML = aicHtml(x) + "<span>" + esc(x.label) + "</span>";
      b.onclick = function(){ call("switch", x.id); };
      list.appendChild(b);
    });
  }
  var sg = S.signed || {};
  each(".ri.ai", list, function(b){
    var ax = aiOf(b.dataset.ai), cur0 = b.querySelector(".aic");
    if ((ax.icon || "") !== (b.dataset.icon || "")) { b.dataset.icon = ax.icon || ""; cur0.outerHTML = aicHtml(ax); }
    b.classList.toggle("on", !S.chatMode && b.dataset.ai === cur);
    b.classList.toggle("vis", vis.length > 1 && vis.indexOf(b.dataset.ai) > -1);
    var out = sg[b.dataset.ai] === false, dot = b.querySelector(".so");
    if (out && !dot) b.insertAdjacentHTML("beforeend", "<b class=\"so\" title=\"Not signed in\"></b>");
    if (!out && dot) dot.remove();
  });
  $("b-signin").hidden = S.chatMode || sg[cur] !== false;
  $("b-signin").title = "Sign in to " + a.label;
  var u = S.update;
  $("b-update").hidden = !u || (u.status !== "ready" && u.status !== "manual");
  $("b-updateT").textContent = u && u.status === "manual" ? "New version" : "Restart to update";
  $("setN").hidden = !u || u.status !== "manual";
  $("r-split").classList.toggle("on", c.split > 1);
  $("splitN").hidden = c.split < 2; $("splitN").textContent = c.split;
  $("r-ask").classList.toggle("on", askOpen);
  each("[data-panel]", $("rail"), function(b){ b.classList.toggle("on", open && tab === b.dataset.panel); });
  drawCols();
  if (open) renderPanel();
}

$("r-chat").onclick = function(){ if (open) closePanel(); call("chat", "chat"); };
$("r-agent").onclick = function(){ if (open) closePanel(); call("chat", "agent"); };

/* ---------- top bar ---------- */
$("b-back").onclick = function(){ call("act", "back"); };
$("b-reload").onclick = function(){ call("act", "reload"); };
$("b-new").onclick = function(){ call("act", "home"); toast("New chat"); };
$("b-mini").onclick = function(){ call("act", "mini"); };
$("b-min").onclick = function(){ call("act", "min"); };
$("b-max").onclick = function(){ call("act", "max"); };
$("b-close").onclick = function(){ call("act", "close"); };
$("b-signin").onclick = function(){ call("signIn", S.focused || S.cfg.ai); };
$("b-update").onclick = function(){ if (S.update && S.update.status === "ready") toast("Updating..."); call("update", S.update && S.update.status === "ready" ? "restart" : "open"); };

/* ---------- find in page ---------- */
function openFind(){ $("find").hidden = false; $("findIn").focus(); $("findIn").select(); }
function closeFind(){ $("find").hidden = true; $("findN").textContent = ""; call("findStop"); }
$("findIn").oninput = function(e){ call("find", e.target.value); };
$("findIn").onkeydown = function(e){
  if (e.key === "Enter") { e.preventDefault(); call("find", $("findIn").value, e.shiftKey); }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeFind(); }
};
$("f-next").onclick = function(){ call("find", $("findIn").value); };
$("f-prev").onclick = function(){ call("find", $("findIn").value, true); };
$("f-x").onclick = closeFind;

/* ---------- ask all ---------- */
$("r-ask").onclick = function(){ toggleAsk(); };
$("askX").onclick = function(){ toggleAsk(false); };
function toggleAsk(v){
  askOpen = v === undefined ? !askOpen : v;
  $("ask").hidden = !askOpen;
  call("ui", { ask: askOpen });
  if (askOpen) setTimeout(function(){ $("askIn").focus(); }, 50);
  render();
}
$("ask").onsubmit = function(e){
  e.preventDefault();
  var t = $("askIn").value.trim(); if (!t) return;
  $("askIn").value = ""; call("askAll", t);
};

/* ---------- side by side ---------- */
$("r-split").onclick = function(){ call("split", S.cfg.split >= 3 ? 1 : S.cfg.split + 1); };
function drawCols(){
  var el = $("cols");
  $("ask").style.left = COLS.left + "px";
  if (!S || COLS.cols.length < 2) { el.innerHTML = ""; el.hidden = true; return; }
  el.hidden = false; el.style.top = COLS.top + "px";
  el.innerHTML = COLS.cols.map(function(c, i){
    var a = aiOf(c.ai);
    return "<div class=\"col" + (c.ai === COLS.focused ? " on" : "") + "\" data-col=\"" + c.ai + "\" style=\"left:" + c.x + "px;width:" + c.width + "px\"><i style=\"background:" + a.color + "\"></i>" + a.label +
      (S.cfg.split === 2 && i === 1 ? "<button class=\"cy\" data-cy=\"1\" title=\"Show another AI here\">Change</button>" : "") + "</div>";
  }).join("");
}
$("cols").addEventListener("click", function(e){
  if (e.target.dataset.cy) { call("cycleSecond"); return; }
  var c = e.target.closest(".col"); if (c) call("focusCol", c.dataset.col);
});

/* ---------- panel ---------- */
each("[data-panel]", $("rail"), function(b){ b.onclick = function(){ togglePanel(b.dataset.panel); }; });
function togglePanel(t){ if (open && tab === t) closePanel(); else openPanel(t); }
function openPanel(t){ tab = t || tab; open = true; $("panel").classList.add("open"); call("ui", { drawer: true }); render(); }
function closePanel(){ open = false; $("panel").classList.remove("open"); call("ui", { drawer: false }); render(); }
$("p-close").onclick = closePanel;
document.addEventListener("keydown", function(e){
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "f") { e.preventDefault(); openFind(); return; }
  if (e.key === "Escape") { if (open) closePanel(); else if (askOpen) toggleAsk(false); } });
function renderPanel(){
  $("ptitle").textContent = TITLES[tab];
  var body = $("pbody");
  if (body.dataset.tab !== tab) { body.dataset.tab = tab; body.scrollTop = 0; }
  if (tab === "chats") renderChats();
  if (tab === "prompts") renderPrompts();
  if (tab === "layout") renderLayout();
  if (tab === "style") renderStyle();
}
function narrow(){ return window.innerWidth < 728; }

/* ---------- chats + time ---------- */
function dayKey(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dur(s){ var m = Math.round(s / 60), h = Math.floor(m / 60); return h ? h + "h " + String(m % 60).padStart(2, "0") + "m" : m + "m"; }
function sum(o){ var t = 0; for (var k in o) t += o[k]; return t; }
function renderChats(){
  var body = $("pbody"), days = [], max = 1, week = 0, perAi = {};
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var st = S.stats[dayKey(d)] || {}, t = sum(st);
    for (var k in st) perAi[k] = (perAi[k] || 0) + st[k];
    days.push({ d: d, t: t }); week += t; if (t > max) max = t;
  }
  var today = days[6].t, goal = S.cfg.goal;
  var bars = days.map(function(x){ return "<div><i style=\"height:" + Math.max(4, Math.round(x.t / max * 40)) + "px\"></i><span>" + x.d.toLocaleDateString(undefined, { weekday: "narrow" }) + "</span></div>"; }).join("");
  var split = S.ais.map(function(a){ var v = perAi[a.id] || 0; return v ? "<i style=\"display:block;width:" + (v / week * 100) + "%;background:" + a.color + "\"></i>" : ""; }).join("");
  var legend = S.ais.map(function(a){ return "<span><b style=\"background:" + a.color + "\"></b>" + a.label + " " + dur(perAi[a.id] || 0) + "</span>"; }).join("");
  body.innerHTML =
    "<div class=\"sec\"><input class=\"field\" id=\"q\" placeholder=\"Search your chats\" value=\"" + esc(q) + "\"><div id=\"hlist\"></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Time used</div><div class=\"card\"><div class=\"stat\"><div><div class=\"muted\">Today</div><div class=\"big\">" + dur(today) + "</div><div class=\"muted\">" + dur(week) + " this week</div></div><div class=\"bars\">" + bars + "</div></div>" +
      (week ? "<div class=\"splitbar\">" + split + "</div><div class=\"legend\">" + legend + "</div>" : "") +
      (goal ? "<div class=\"goal\"><i style=\"width:" + Math.min(100, today / (goal * 60) * 100) + "%\"></i></div>" : "") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Daily goal</div><div class=\"seg\">" + [[0,"Off"],[30,"30m"],[60,"1h"],[120,"2h"],[180,"3h"]].map(function(g){ return "<button class=\"" + (goal === g[0] ? "on" : "") + "\" data-goal=\"" + g[0] + "\">" + g[1] + "</button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"row\"><button class=\"chip\" id=\"clearH\">" + (armed.clear ? "Click again to clear" : "Clear history") + "</button></div></div>";
  $("q").oninput = function(e){ q = e.target.value; renderList(); };
  each("[data-goal]", body, function(b){ b.onclick = function(){ set({ goal: +b.dataset.goal, goalDay: "" }); }; });
  $("clearH").onclick = function(){
    if (!armed.clear) { armed.clear = true; renderChats(); setTimeout(function(){ armed.clear = false; if (open && tab === "chats") renderChats(); }, 2500); return; }
    armed.clear = false; call("clearHistory"); toast("History cleared");
  };
  renderList();
}
function itemHtml(h, tm){
  return "<button class=\"hitem\" data-url=\"" + esc(h.url) + "\" data-ai=\"" + h.ai + "\"><i class=\"d\" style=\"background:" + aiOf(h.ai).color + "\"></i><span class=\"tt\">" + esc(h.title) + "</span><span class=\"tm\">" + tm + "</span><span class=\"pin" + (h.pinned ? " on" : "") + "\" data-pin=\"1\" title=\"Pin\">&#9733;</span><span class=\"x\" data-rm=\"1\" title=\"Remove\">&times;</span></button>";
}
function renderList(){
  var el = $("hlist"); if (!el) return;
  var list = S.history.filter(function(h){ return !q || h.title.toLowerCase().indexOf(q.toLowerCase()) > -1; });
  if (!list.length) { el.innerHTML = "<div class=\"empty\">" + (q ? "No chats found" : "Your chats will show up here") + "</div>"; return; }
  var now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var groups = [["Today", t0], ["Yesterday", t0 - 864e5], ["This week", t0 - 6 * 864e5], ["Earlier", 0]];
  var html = "", gi = -1;
  var pins = list.filter(function(h){ return h.pinned; });
  if (pins.length) { html += "<div class=\"group\">Pinned</div>"; pins.forEach(function(h){ html += itemHtml(h, new Date(h.time).toLocaleDateString([], { day: "numeric", month: "short" })); }); }
  list.filter(function(h){ return !h.pinned; }).slice(0, 200).forEach(function(h){
    var g = 0; while (h.time < groups[g][1]) g++;
    if (g !== gi) { gi = g; html += "<div class=\"group\">" + groups[g][0] + "</div>"; }
    var d = new Date(h.time);
    html += itemHtml(h, g < 2 ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString([], { day: "numeric", month: "short" }));
  });
  el.innerHTML = html;
}
$("pbody").addEventListener("click", function(e){
  var it = e.target.closest(".hitem"); if (!it) return;
  if (e.target.dataset.rm) { call("removeHistory", it.dataset.url); return; }
  if (e.target.dataset.pin) { call("pinHistory", it.dataset.url); return; }
  call("open", it.dataset.ai, it.dataset.url);
  if (narrow()) closePanel();
});

/* ---------- prompts ---------- */
function renderPrompts(){
  var body = $("pbody");
  var list = S.prompts.map(function(p){
    return "<div class=\"pcard\"><div class=\"pt\"><span>" + esc(p.title) + "</span><button class=\"use\" data-use=\"" + p.id + "\">Use</button><button class=\"del\" data-del=\"" + p.id + "\" title=\"Delete\">&times;</button></div><p>" + esc(p.text.trim()) + "</p></div>";
  }).join("");
  body.innerHTML =
    "<div class=\"sec\">" + (adding
      ? "<div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\"><input class=\"field\" id=\"pTitle\" placeholder=\"Name\" maxlength=\"40\"><textarea class=\"field\" id=\"pText\" placeholder=\"Your prompt\"></textarea><div class=\"row\"><button class=\"chip white\" id=\"pSave\">Save</button><button class=\"chip\" id=\"pCancel\">Cancel</button></div></div>"
      : "<button class=\"chip white\" id=\"pAdd\" style=\"align-self:flex-start\">+ New prompt</button>") + "</div>" +
    "<div class=\"sec\">" + (list || "<div class=\"empty\">No prompts yet</div>") + "</div>";
  if (adding) {
    $("pTitle").focus();
    $("pSave").onclick = function(){
      var t = $("pTitle").value.trim(), x = $("pText").value;
      if (!t || !x.trim()) { toast("Add a name and a prompt"); return; }
      S.prompts = [{ id: "p" + Date.now(), title: t, text: x }].concat(S.prompts);
      call("savePrompts", S.prompts); adding = false; renderPrompts(); toast("Prompt saved");
    };
    $("pCancel").onclick = function(){ adding = false; renderPrompts(); };
  } else $("pAdd").onclick = function(){ adding = true; renderPrompts(); };
  each("[data-use]", body, function(b){ b.onclick = function(){
    var p = S.prompts.filter(function(x){ return x.id === b.dataset.use; })[0];
    if (narrow()) closePanel();
    call("usePrompt", p.text);
  }; });
  each("[data-del]", body, function(b){ b.onclick = function(){
    S.prompts = S.prompts.filter(function(x){ return x.id !== b.dataset.del; }); call("savePrompts", S.prompts); renderPrompts();
  }; });
}

/* ---------- size ---------- */
function tileHtml(key, r, on){
  return "<button class=\"tile" + (on ? " on" : "") + "\" data-size=\"" + key + "\"><div class=\"scr\"><i style=\"left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%\"></i></div><span>" + S.sizeNames[key] + "</span></button>";
}
function toggle(key, label, sub){
  return "<label class=\"tg\"><span>" + label + (sub ? "<small>" + sub + "</small>" : "") + "</span><input type=\"checkbox\" data-key=\"" + key + "\"" + (S.cfg[key] ? " checked" : "") + "><span class=\"k\"></span></label>";
}
function bindToggles(body){ each("input[data-key]", body, function(i){ i.onchange = function(){ var p = {}; p[i.dataset.key] = i.checked; set(p); }; }); }
function renderLayout(){
  var c = S.cfg, body = $("pbody");
  var fixed = ["mini","small","medium","large","xl","custom"].indexOf(c.size) > -1;
  body.innerHTML =
    "<div class=\"sec\"><div class=\"lbl\">Show</div><div class=\"seg\">" + [[1,"1 AI"],[2,"2 AIs"],[3,"All 3"]].map(function(s){ return "<button class=\"" + (c.split === s[0] ? "on" : "") + "\" data-split=\"" + s[0] + "\">" + s[1] + "</button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Window size</div><div class=\"tiles\">" + TILES.map(function(t){ return tileHtml(t[0], t[1], c.size === t[0]); }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Place</div><div class=\"row\" style=\"gap:14px;align-items:center\"><div class=\"pos\">" +
      POS.map(function(p){ return "<button data-pos=\"" + p + "\" class=\"" + (fixed && c.position === p ? "on" : "") + "\" aria-label=\"" + p + "\"></button>"; }).join("") +
    "</div><div class=\"muted\" style=\"flex:1\">Or drag the top bar anywhere.</div></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Own size</div><div class=\"wh\"><input class=\"field\" type=\"number\" id=\"cw\" min=\"360\" value=\"" + c.width + "\" aria-label=\"Width\"><span class=\"muted\">&times;</span><input class=\"field\" type=\"number\" id=\"ch\" min=\"420\" value=\"" + c.height + "\" aria-label=\"Height\"><button class=\"chip white\" id=\"cset\">Set</button></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Text size</div><div class=\"zoom\"><button class=\"chip\" id=\"zo\">A&minus;</button><b>" + c.zoom + "%</b><button class=\"chip\" id=\"zi\">A+</button><button class=\"chip\" id=\"zr\">Reset</button></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">See-through " + c.opacity + "%</div><input type=\"range\" id=\"op\" min=\"40\" max=\"100\" step=\"5\" value=\"" + c.opacity + "\"></div>" +
    "<div class=\"sec\"><div class=\"card\">" + toggle("alwaysOnTop", "Keep on top", "Stays above other windows") +
      "<label class=\"tg\"><span>Mini mode<small>Small, in the corner, on top</small></span><input type=\"checkbox\" id=\"mm\"" + (c.mini ? " checked" : "") + "><span class=\"k\"></span></label></div></div>";
  each("[data-split]", body, function(b){ b.onclick = function(){ call("split", +b.dataset.split); }; });
  each("[data-size]", body, function(b){ b.onclick = function(){ set({ size: b.dataset.size }); }; });
  each("[data-pos]", body, function(b){ b.onclick = function(){ set(fixed ? { position: b.dataset.pos } : { size: "medium", position: b.dataset.pos }); }; });
  $("cset").onclick = function(){ set({ size: "custom", position: "center", width: +$("cw").value || 860, height: +$("ch").value || 760 }); };
  $("zo").onclick = function(){ call("act", "zoomOut"); };
  $("zi").onclick = function(){ call("act", "zoomIn"); };
  $("zr").onclick = function(){ set({ zoom: 100 }); };
  $("op").onchange = function(e){ set({ opacity: +e.target.value }); };
  $("mm").onchange = function(){ call("act", "mini"); };
  bindToggles(body);
}

/* ---------- style ---------- */
function rr(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
function drawIcon(){
  var cv = $("cv"); if (!cv) return;
  var x = cv.getContext("2d"), col = COLORS[ic.col];
  x.clearRect(0, 0, 256, 256);
  var g = x.createLinearGradient(0, 0, 256, 256); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]); x.fillStyle = g;
  x.save();
  if (ic.shape === "Circle") { x.beginPath(); x.arc(128, 128, 128, 0, 7); x.fill(); }
  else if (ic.shape === "Diamond") { x.translate(128, 128); x.rotate(Math.PI / 4); rr(x, -90, -90, 180, 180, 36); x.fill(); x.setTransform(1, 0, 0, 1, 0, 0); }
  else { rr(x, 0, 0, 256, 256, ic.shape === "Squircle" ? 96 : 56); x.fill(); }
  x.restore();
  var t = (ic.glyph || S.cfg.name || "E").trim().slice(0, 2) || "E";
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "800 " + (t.length > 1 ? 104 : 136) + "px system-ui,-apple-system,Segoe UI,sans-serif";
  x.shadowColor = "rgba(0,0,0,.25)"; x.shadowBlur = 18; x.shadowOffsetY = 6;
  x.fillText(t, 128, 134);
}
function renderStyle(){
  var c = S.cfg, body = $("pbody"), m = mod(), ms = S.isMac ? "⌘ ⇧" : "Ctrl Shift", ma = S.isMac ? "⌘ ⌥" : "Ctrl Alt";
  var keys = [["Switch AI", m + " 1 / 2 / 3"], ["New chat", m + " N"], ["Find in page", m + " F"], ["Show / hide app", S.hotkeyLabel], ["Chats", ms + " H"], ["Size", ms + " L"], ["Mini mode", ma + " ↓"], ["Left / right half", ma + " ← / →"], ["Full screen", ma + " ↑"], ["Text size", m + " + / −"]];
  var sg = S.signed || {}, u = S.update;
  var accs = S.ais.map(function(a){
    var st = sg[a.id], txt = st ? "Signed in" : st === false ? "Not signed in" : "Checking...";
    var btn = st ? "<button class=\"chip\" data-out=\"" + a.id + "\">" + (armed["out" + a.id] ? "Sure?" : "Sign out") + "</button>" : "<button class=\"chip white\" data-in=\"" + a.id + "\">Sign in</button>";
    return "<div class=\"acc\">" + aicHtml(a) + "<div class=\"an\">" + a.label + "<small class=\"" + (st ? "ok" : "") + "\">" + txt + "</small></div>" + btn + "</div>";
  }).join("");
  var ut = !u ? "You have the newest version" : u.status === "downloading" ? "Downloading " + u.version + "... " + (u.pct || 0) + "%" : u.status === "ready" ? "Version " + u.version + " is ready" : u.status === "manual" ? "Version " + u.version + " is out" : "Updating...";
  var ub = u && u.status === "ready" ? "<button class=\"chip white\" id=\"upR\">Restart</button>" : u && u.status === "manual" ? "<button class=\"chip white\" id=\"upO\">Get it</button>" : "<button class=\"chip\" id=\"upC\">Check</button>";
  body.innerHTML =
    "<div class=\"sec\"><div class=\"lbl\">Accounts</div><div class=\"card\" style=\"padding:6px 14px\">" + accs + "</div><div class=\"muted\">Google sign-in blocked? Use <b>Continue with email</b> instead.</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Name</div><input class=\"field\" id=\"nm\" maxlength=\"40\" value=\"" + esc(c.name) + "\"></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Colour</div><div class=\"row\">" + ACCENTS.map(function(a){ return "<button class=\"sw" + (c.accent === a ? " on" : "") + "\" data-acc=\"" + a + "\" style=\"background:" + a + "\" aria-label=\"Colour\"></button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Look</div><div class=\"seg\">" + [["aurora","Aurora"],["midnight","Midnight"],["black","Black"]].map(function(t){ return "<button class=\"" + (c.theme === t[0] ? "on" : "") + "\" data-theme=\"" + t[0] + "\">" + t[1] + "</button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Icon</div><div class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><div class=\"iconrow\"><canvas id=\"cv\" width=\"256\" height=\"256\"></canvas><div style=\"flex:1;display:flex;flex-direction:column;gap:8px;min-width:0\"><input class=\"field\" id=\"gl\" maxlength=\"2\" placeholder=\"Letters\" value=\"" + esc(ic.glyph) + "\"><div class=\"row\" style=\"gap:6px\">" +
      COLORS.map(function(p, i){ return "<button class=\"sw" + (ic.col === i ? " on" : "") + "\" data-icol=\"" + i + "\" style=\"background:linear-gradient(135deg," + p[0] + "," + p[1] + ")\" aria-label=\"Icon colour\"></button>"; }).join("") +
    "</div></div></div><div class=\"seg\">" + SHAPES.map(function(s){ return "<button class=\"" + (ic.shape === s ? "on" : "") + "\" data-ishape=\"" + s + "\">" + s + "</button>"; }).join("") +
    "</div><div class=\"row\"><button class=\"chip white\" id=\"iu\">Use icon</button><button class=\"chip\" id=\"ip\">Upload</button><button class=\"chip\" id=\"idf\">Default</button></div></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Easy use</div><div class=\"card\">" +
      toggle("keepSignedIn", "Stay signed in", "Log in once") + toggle("resume", "Open last chat", "Start where you left off") +
      toggle("hotkey", "Show / hide shortcut", S.hotkeyLabel) + toggle("autoHide", "Hide when I click away") +
      toggle("startup", "Start with computer") + toggle("closeToTray", "Keep running when closed") +
    "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Shortcuts</div><div class=\"keys\">" + keys.map(function(k){ return "<span>" + k[0] + "</span><kbd>" + k[1] + "</kbd>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Updates</div><div class=\"card ver\"><div><b>" + esc(S.cfg.name) + " " + esc(S.version || "") + "</b><div class=\"muted\">" + ut + "</div></div>" + ub + "</div><div class=\"muted\">New versions install by themselves.</div></div>" +
    "<div class=\"sec\"><div class=\"row\"><button class=\"chip\" id=\"wl\">Show welcome</button><button class=\"chip\" id=\"rs\">" + (armed.reset ? "Click again to reset" : "Reset settings") + "</button></div></div>";
  drawIcon();
  $("nm").onchange = function(e){ set({ name: e.target.value.trim() || "Expecct" }); };
  $("gl").oninput = function(e){ ic.glyph = e.target.value; drawIcon(); };
  each("[data-icol]", body, function(b){ b.onclick = function(){ ic.col = +b.dataset.icol; renderStyle(); }; });
  each("[data-ishape]", body, function(b){ b.onclick = function(){ ic.shape = b.dataset.ishape; renderStyle(); }; });
  each("[data-acc]", body, function(b){ b.onclick = function(){ set({ accent: b.dataset.acc }); }; });
  each("[data-theme]", body, function(b){ b.onclick = function(){ set({ theme: b.dataset.theme }); }; });
  $("iu").onclick = function(){ set({ icon: $("cv").toDataURL("image/png") }).then(function(){ toast("New icon"); }); };
  $("ip").onclick = function(){ call("pickIcon").then(function(d){ if (d) set({ icon: d }).then(function(){ toast("New icon"); }); }); };
  $("idf").onclick = function(){ set({ icon: null }); };
  $("rs").onclick = function(){
    if (!armed.reset) { armed.reset = true; renderStyle(); setTimeout(function(){ armed.reset = false; if (open && tab === "style") renderStyle(); }, 2500); return; }
    armed.reset = false; call("reset").then(function(s){ S = s; render(); toast("Settings reset"); });
  };
  $("wl").onclick = function(){ closePanel(); showWelcome(); };
  each("[data-in]", body, function(b){ b.onclick = function(){ if (narrow()) closePanel(); call("signIn", b.dataset.in); }; });
  each("[data-out]", body, function(b){ b.onclick = function(){
    var k = "out" + b.dataset.out;
    if (!armed[k]) { armed[k] = true; renderStyle(); setTimeout(function(){ armed[k] = false; if (open && tab === "style") renderStyle(); }, 2500); return; }
    armed[k] = false; call("signOut", b.dataset.out);
  }; });
  if ($("upC")) $("upC").onclick = function(){ toast("Checking..."); call("update", "check"); };
  if ($("upR")) $("upR").onclick = function(){ toast("Updating..."); call("update", "restart"); };
  if ($("upO")) $("upO").onclick = function(){ call("update", "open"); };
  bindToggles(body);
}

/* ---------- welcome ---------- */
var w = { step: 0, ai: null, name: "", accent: null, size: "medium" };
var WSIZES = ["mini","medium","large","left","right","full"];
function showWelcome(){
  w = { step: 0, ai: S.cfg.ai, name: S.cfg.name, accent: S.cfg.accent, size: "medium" };
  $("welcome").hidden = false; call("ui", { welcome: true }); drawWelcome();
}
function drawWelcome(){
  var b = $("wbox"), dots = "<div class=\"dots\">" + [0,1,2,3].map(function(i){ return "<i class=\"" + (i === w.step ? "on" : "") + "\"></i>"; }).join("") + "</div>";
  var back = w.step ? "<button class=\"link\" id=\"wb\">Back</button>" : "";
  var html = "";
  if (w.step === 0) html = "<img class=\"hero\" src=\"" + iconSrc() + "\" alt=\"\"><h1>Welcome to<br>" + esc(S.cfg.name) + "</h1><button class=\"big-btn\" id=\"wn\">Start</button>";
  if (w.step === 1) html = "<h1>Pick your AI</h1><div class=\"aipick\">" + S.ais.map(function(a){ return "<button data-wai=\"" + a.id + "\" class=\"" + (w.ai === a.id ? "on" : "") + "\">" + (a.icon ? "<i style=\"background:#fff;padding:7px\"><img src=\"" + esc(a.icon) + "\" alt=\"\" style=\"width:100%;height:100%;object-fit:contain;display:block\"></i>" : "<i style=\"background:" + a.color + "\"></i>") + a.label + "</button>"; }).join("") + "</div><button class=\"big-btn\" id=\"wn\">Next</button>";
  if (w.step === 2) html = "<h1>Pick a size</h1><div class=\"tiles wtiles\">" + WSIZES.map(function(k){ var r = TILES.filter(function(t){ return t[0] === k; })[0][1]; return tileHtml(k, r, w.size === k); }).join("") + "</div><button class=\"big-btn\" id=\"wn\">Next</button>";
  if (w.step === 3) {
    var on = (S.signed || {})[w.ai];
    html = "<img class=\"hero\" src=\"" + iconSrc() + "\" alt=\"\"><h1>" + (on ? "You're signed in" : "Sign in once.<br>We remember you.") + "</h1>" +
      "<button class=\"big-btn\" id=\"wn\">" + (on ? "Open " : "Sign in to ") + esc(aiOf(w.ai).label) + "</button>" +
      (on ? "" : "<button class=\"link\" id=\"wskip\">Later</button><div class=\"muted\">Google sign-in blocked? Use <b>Continue with email</b>.</div>");
  }
  b.innerHTML = "<div class=\"wstep\">" + html + dots + back + "</div>";
  document.documentElement.style.setProperty("--accent", w.accent);
  if ($("wb")) $("wb").onclick = function(){ w.step--; drawWelcome(); };
  if ($("wname")) $("wname").oninput = function(e){ w.name = e.target.value; };
  each("[data-wai]", b, function(x){ x.onclick = function(){ w.ai = x.dataset.wai; drawWelcome(); }; });
  each("[data-wacc]", b, function(x){ x.onclick = function(){ w.accent = x.dataset.wacc; drawWelcome(); }; });
  each("[data-size]", b, function(x){ x.onclick = function(){ w.size = x.dataset.size; drawWelcome(); }; });
  function finish(login){
    $("welcome").hidden = true;
    set({ ai: w.ai, size: w.size, position: "center", welcomed: true })
      .then(function(){ call("ui", { welcome: false }); if (login) call("signIn", w.ai); });
  }
  if ($("wskip")) $("wskip").onclick = function(){ finish(false); };
  $("wn").onclick = function(){
    if (w.step < 3) { w.step++; drawWelcome(); return; }
    finish((S.signed || {})[w.ai] === false);
  };
}

/* ---------- events ---------- */
window.exacct.on("state", function(s){ S = s; render(); });
window.exacct.on("history", function(h){ if (!S) return; S.history = h; if (open && tab === "chats") renderList(); });
window.exacct.on("nav", function(n){ $("b-back").disabled = !n.canBack; });
window.exacct.on("loading", function(l){ document.body.classList.toggle("loading", !!l); });
window.exacct.on("toast", toast);
var noticeAi = null;
function placeNotice(){ var n = $("notice"); n.style.left = COLS.left + "px"; n.style.top = "calc(var(--top) + " + (askOpen ? 54 : 0) + "px)"; }
window.exacct.on("notice", function(d){
  noticeAi = d.ai;
  var g = d.ai === "gemini";
  $("noticeT").textContent = g ? "Open Gemini in its own Chrome or Edge window and sign in with Google there." : "Use “Continue with email” on the sign-in page, or open " + d.label + " in its own browser window.";
  $("noticeEmail").hidden = g;
  placeNotice(); $("notice").hidden = false;
});
$("noticeOpen").onclick = function(){ $("notice").hidden = true; call("openAppWindow", noticeAi); };
$("noticeEmail").onclick = function(){ $("notice").hidden = true; call("emailLogin", noticeAi); };
$("noticeX").onclick = function(){ $("notice").hidden = true; call("closeNotice"); };

window.exacct.on("find", openFind);
window.exacct.on("found", function(r){ $("findN").textContent = r ? (r.total ? r.active + "/" + r.total : "0") : ""; });
window.exacct.on("drawer", function(t){ togglePanel(t); });
window.exacct.on("cols", function(c){ COLS = c; drawCols(); if (!$("notice").hidden) placeNotice(); });
call("state").then(function(s){ S = s; render(); if (!S.cfg.welcomed) showWelcome(); });
</script>
