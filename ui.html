<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Exacct AI</title>
<style>
:root{--bg:#09090b;--panel:#0f0f13;--card:#16161c;--card2:#1c1c24;--fg:#f4f4f5;--muted:#8b8b96;--line:rgba(255,255,255,.08);--accent:#8b5cf6;--pink:#ec4899;--gold:#d6a35c;--top:52px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ===== top bar ===== */
.bar{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;-webkit-app-region:drag;z-index:20;background:#0d0c12;border-bottom:1px solid var(--line)}
.t-aurora .bar{background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 22%,#0d0c12),#0d0c12 38%,#0d0c12 62%,color-mix(in srgb,var(--pink) 14%,#0d0c12))}
.t-midnight .bar{background:#14112a}
.t-black .bar{background:#000}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--pink),var(--gold),transparent);background-size:200% 100%;opacity:.8;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.mac .bar{padding-left:86px}
.id{display:flex;align-items:center;gap:9px;min-width:0}
.id img{width:26px;height:26px;border-radius:7px;flex:none;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--accent) 50%,transparent))}
.name{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.mid{flex:1;display:flex;justify-content:center;min-width:0}
.switch{position:relative;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);-webkit-app-region:no-drag}
.switch button{position:relative;z-index:1;border:0;background:none;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .2s}
.switch button.on{color:#0b0b0f}
.switch .dot{width:8px;height:8px;border-radius:50%;flex:none}
.switch button.on .dot{box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.pill{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.tools{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag}
.ib{width:34px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s,transform .15s}
.ib:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.ib:active{transform:scale(.9)}
.ib:disabled{opacity:.3;pointer-events:none}
.ib.on{color:var(--fg);background:color-mix(in srgb,var(--accent) 30%,transparent)}
.ib svg{width:17px;height:17px}
.sep{width:1px;height:20px;background:var(--line);margin:0 5px}
.ib.close:hover{background:#e5484d;color:#fff}
.mac .win{display:none!important}
.loadbar{position:fixed;top:calc(var(--top) - 2px);left:0;right:0;height:2px;z-index:21;overflow:hidden;opacity:0;transition:opacity .3s}
.loading .loadbar{opacity:1}
.loadbar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--accent),var(--pink),transparent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.toast{position:absolute;left:50%;top:9px;transform:translate(-50%,-60px);background:#fff;color:#0b0b0f;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:30;white-space:nowrap;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
@media (max-width:820px){.name{display:none}}
@media (max-width:700px){.hs{display:none!important}.switch button{padding:6px 10px}}
@media (max-width:480px){.hm{display:none!important}.switch button span.lb{display:none}.switch button{padding:7px 9px}}

/* ask all + columns */
.ask{position:fixed;top:var(--top);left:0;right:0;height:54px;z-index:9;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0d0c12;border-bottom:1px solid var(--line);animation:up .25s ease both}
.ask input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:none;font-weight:600}
.ask input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.ask .go{border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff;white-space:nowrap}
.ask .dots3{display:flex;gap:4px}.ask .dots3 i{width:8px;height:8px;border-radius:50%}
.cols{position:fixed;left:0;right:0;height:30px;z-index:8}
.col{position:absolute;top:0;height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted);background:#0d0c12;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer;transition:color .2s}
.col.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.col i{width:8px;height:8px;border-radius:50%;flex:none}
.col .cy{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.col .cy:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.upd{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;background:var(--gold);color:#0b0b0f;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px var(--gold)}}
.goal{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px;transition:width .5s}
.hitem .pin{opacity:0;border:0;background:none;color:var(--muted);padding:0 2px;font-size:14px}
.hitem:hover .pin,.hitem .pin.on{opacity:1}
.hitem .pin.on{color:var(--gold)}

/* stage behind the AI */
.stage{position:fixed;inset:var(--top) 0 0 0;display:grid;place-items:center}
.stage img{width:90px;height:90px;opacity:.5;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* ===== drawer ===== */
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:372px;background:var(--panel);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);user-select:text}
.drawer.open{transform:none}
@media (max-width:759px){.drawer{width:100%;border-left:0}}
.dhead{display:flex;align-items:center;gap:4px;padding:10px 10px 0 12px;border-bottom:1px solid var(--line)}
.tab{position:relative;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:10px 10px 12px}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--pink))}
.dhead .ib{margin-left:auto}
.dbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.dbody::-webkit-scrollbar{width:8px}.dbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
.sec{display:flex;flex-direction:column;gap:10px;animation:up .35s ease both}
.sec:nth-child(2){animation-delay:.04s}.sec:nth-child(3){animation-delay:.08s}.sec:nth-child(4){animation-delay:.12s}.sec:nth-child(5){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;transition:all .15s}
.chip:hover{border-color:rgba(255,255,255,.25)}
.chip.on{background:#fff;color:#0b0b0f;border-color:#fff}
.chip.white{background:#fff;color:#0b0b0f;border-color:#fff}
.chip:active{transform:scale(.95)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 11px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:80px}
.muted{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}

/* chats */
.stat{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bars{display:flex;align-items:flex-end;gap:5px;height:56px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:12px;border-radius:4px;background:linear-gradient(180deg,var(--pink),var(--accent));min-height:3px;transition:height .5s cubic-bezier(.2,.9,.3,1)}
.bars span{font-size:9.5px;color:var(--muted)}
.split{display:flex;height:6px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.06);margin-top:12px}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.legend b{width:8px;height:8px;border-radius:50%;display:inline-block}
.group{font-size:11px;color:var(--muted);font-weight:700;margin:6px 2px 2px}
.hitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:11px;transition:background .15s}
.hitem:hover{background:var(--card)}
.hitem .d{width:8px;height:8px;border-radius:50%;flex:none}
.hitem .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hitem .tm{font-size:11px;color:var(--muted);flex:none}
.hitem .x{opacity:0;border:0;background:none;color:var(--muted);padding:0 2px;font-size:15px}
.hitem:hover .x{opacity:1}

/* prompts */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.pcard .pt{display:flex;align-items:center;gap:8px;font-weight:700}
.pcard .pt span{flex:1}
.pcard p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.use{border:0;border-radius:999px;padding:5px 12px;font-weight:800;font-size:12px;background:linear-gradient(90deg,var(--accent),var(--pink));color:#fff}
.del{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.del:hover{color:#ff6b6b}

/* layout */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 8px 7px;display:flex;flex-direction:column;gap:6px;align-items:stretch;transition:all .18s}
.tile:hover{border-color:rgba(255,255,255,.25);transform:translateY(-2px)}
.tile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card));box-shadow:0 0 0 1px var(--accent)}
.scr{position:relative;aspect-ratio:16/10;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.scr i{position:absolute;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--pink));transition:all .35s cubic-bezier(.3,1.3,.5,1)}
.tile span{font-size:11px;font-weight:700;text-align:center;color:#d4d4d8}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:150px;aspect-ratio:16/10;padding:6px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.pos button{border:1px dashed rgba(255,255,255,.12);border-radius:5px;background:transparent;transition:all .15s}
.pos button:hover{background:rgba(255,255,255,.07)}
.pos button.on{background:var(--accent);border:1px solid var(--accent);box-shadow:0 0 12px var(--accent)}
.wh{display:flex;gap:6px;align-items:center}
.wh input{width:80px}
.zoom{display:flex;align-items:center;gap:10px}
.zoom b{min-width:48px;text-align:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:4px 0}
.tg input{display:none}
.tg .k{width:40px;height:23px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tg .k::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg input:checked+.k{background:var(--accent);border-color:var(--accent)}
.tg input:checked+.k::after{transform:translateX(17px)}
.tg small{display:block;color:var(--muted);font-size:11.5px}

/* style */
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;transition:transform .15s}
.sw.on{border-color:#fff;transform:scale(1.15)}
.iconrow{display:flex;gap:14px;align-items:center}
canvas{width:76px;height:76px;flex:none}
.keys{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px;color:var(--muted)}
kbd{font:600 11px/1 system-ui,sans-serif;background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:4px 6px;color:var(--fg);white-space:nowrap}

/* welcome */
.welcome{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:radial-gradient(60% 50% at 30% 30%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%),radial-gradient(50% 50% at 80% 80%,rgba(236,72,153,.25),transparent 70%),var(--bg);-webkit-app-region:drag}
.wbox{width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;-webkit-app-region:no-drag}
.wbox h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wbox .hero{width:110px;height:110px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 18px 40px color-mix(in srgb,var(--accent) 60%,transparent))}
.wstep{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;animation:up .4s ease both}
.aipick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.aipick button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;transition:all .2s}
.aipick button i{width:34px;height:34px;border-radius:11px;display:block}
.aipick button.on{border-color:#fff;background:var(--card2);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.big-btn{border:0;border-radius:999px;padding:13px 28px;font-weight:800;font-size:15px;background:#fff;color:#0b0b0f;transition:transform .2s,box-shadow .2s}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px color-mix(in srgb,var(--accent) 60%,transparent)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.2);transition:all .3s}
.dots i.on{width:22px;background:#fff}
.link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.wtiles{grid-template-columns:repeat(3,1fr);width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="t-aurora">
<header class="bar">
  <div class="id"><img id="icon" alt=""><span class="name" id="name">Exacct AI</span></div>
  <div class="mid"><div class="switch" id="switch"><span class="pill" id="pill"></span></div></div>
  <div class="tools">
    <button class="ib hs" id="b-back" title="Back" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
    <button class="ib hs" id="b-home" title="New chat"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
    <button class="ib hs" id="b-reload" title="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg></button>
    <span class="sep hs"></span>
    <button class="upd" id="b-upd" hidden>Update</button>
    <button class="ib" id="t-ask" title="Ask all 3"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/><path d="M5.5 7h.01M8 7h.01M10.5 7h.01"/></svg></button>
    <button class="ib hm" id="b-split" title="Side by side"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M6 2.5v11M10 2.5v11"/></svg></button>
    <button class="ib" id="t-chats" title="Chats and time used"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.3 1.5"/></svg></button>
    <button class="ib hm" id="t-prompts" title="Prompts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg></button>
    <button class="ib" id="t-layout" title="Size and place"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M8 2.5v11M8 8h6.2"/></svg></button>
    <button class="ib hm" id="t-style" title="Style"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5l1.6 3.9 4 .3-3.1 2.6 1 4L8 10.1 4.5 12.3l1-4L2.4 5.7l4-.3z"/></svg></button>
    <button class="ib" id="b-mini" title="Mini mode"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><rect x="8.3" y="8" width="4.4" height="3.6" rx="1" fill="currentColor"/></svg></button>
    <button class="ib hs" id="b-pin" title="Keep on top"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg></button>
    <span class="sep win"></span>
    <button class="ib win hm" id="b-min" title="Minimise"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
    <button class="ib win hm" id="b-max" title="Maximise"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></button>
    <button class="ib win close" id="b-close" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="toast" id="toast"></div>
</header>
<div class="loadbar"><i></i></div>
<form class="ask" id="ask" hidden><span class="dots3"><i style="background:#10a37f"></i><i style="background:#d97757"></i><i style="background:#4f8cff"></i></span><input id="askIn" placeholder="Ask all 3 at once" autocomplete="off"><button class="go" type="submit">Ask all</button><button class="ib" type="button" id="askX" title="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></form>
<div class="cols" id="cols" hidden></div>
<div class="stage"><img id="stageIcon" alt=""></div>

<aside class="drawer" id="drawer" aria-label="Panel">
  <div class="dhead">
    <button class="tab" data-tab="chats">Chats</button>
    <button class="tab" data-tab="prompts">Prompts</button>
    <button class="tab" data-tab="layout">Size</button>
    <button class="tab" data-tab="style">Style</button>
    <button class="ib" id="d-close" title="Close panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="welcome" id="welcome" hidden><div class="wbox" id="wbox"></div></div>

<script>
var S = null, tab = "chats", open = false, q = "", armed = {};
var ic = { col: 0, shape: "Rounded", glyph: "" };
var COLORS = [["#8b5cf6","#ec4899"],["#10a37f","#0b6e56"],["#d97757","#b4533a"],["#4f8cff","#a855f7"],["#06b6d4","#2563eb"],["#f59e0b","#ef4444"],["#22c55e","#0ea5e9"],["#3f3f46","#09090b"],["#e11d48","#7c3aed"],["#eab308","#f97316"]];
var ACCENTS = ["#8b5cf6","#ec4899","#10a37f","#d97757","#4f8cff","#06b6d4","#f59e0b","#ef4444","#22c55e","#e4e4e7"];
var SHAPES = ["Rounded","Circle","Squircle","Diamond"];
var TILES = [["mini",[73,54,22,40]],["small",[36,19,28,62]],["medium",[26,14,48,72]],["large",[17,9,66,82]],["xl",[8,5,84,90]],["focus",[15,8,70,84]],["tall",[68,0,32,100]],["left",[0,0,50,100]],["right",[50,0,50,100]],["left3",[0,0,33,100]],["right3",[67,0,33,100]],["top",[0,0,100,50]],["bottom",[0,50,100,50]],["full",[0,0,100,100]]];
var POS = ["tl","tc","tr","ml","center","mr","bl","bc","br"];
var call = window.exacct.call;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function set(p){ return call("set", p).then(function(s){ S = s; render(); }); }
function iconSrc(){ return S.cfg.icon || "icon.png"; }
function aiOf(id){ return S.ais.filter(function(a){ return a.id === id; })[0] || S.ais[0]; }

/* ---------- toast ---------- */
var tt;
function toast(t){ var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("show"); }, 1700); }

/* ---------- top bar ---------- */
function render(){
  if (!S) return;
  var c = S.cfg;
  document.documentElement.style.setProperty("--accent", c.accent);
  document.body.className = document.body.className.replace(/\bt-\w+/g, "").replace(/\bmac\b/, "").trim() + " t-" + c.theme + (S.isMac ? " mac" : "");
  $("name").textContent = c.name; document.title = c.name;
  $("icon").src = iconSrc(); $("stageIcon").src = iconSrc();
  $("b-pin").classList.toggle("on", !!c.alwaysOnTop);
  $("b-mini").classList.toggle("on", !!c.mini);
  var sw = $("switch");
  if (!sw.querySelector("button")) {
    S.ais.forEach(function(a){
      var b = document.createElement("button");
      b.dataset.ai = a.id; b.title = a.label;
      b.innerHTML = "<i class=\"dot\" style=\"background:" + a.color + "\"></i><span class=\"lb\">" + esc(a.label) + "</span>";
      b.onclick = function(){ call("switch", a.id); };
      sw.appendChild(b);
    });
  }
  Array.prototype.forEach.call(sw.querySelectorAll("button"), function(b){ b.classList.toggle("on", b.dataset.ai === (S.focused || c.ai)); });
  $("b-split").classList.toggle("on", c.split > 1);
  $("b-upd").hidden = !S.update; if (S.update) $("b-upd").title = "Version " + S.update + " is ready";
  movePill(); drawCols();
  ["chats","prompts","layout","style"].forEach(function(t){ $("t-" + t).classList.toggle("on", open && tab === t); });
  if (open) renderTab();
}
function movePill(){
  var b = $("switch").querySelector("button.on"); if (!b) return;
  $("pill").style.width = b.offsetWidth + "px";
  $("pill").style.transform = "translateX(" + b.offsetLeft + "px)";
}
window.addEventListener("resize", movePill);

$("b-back").onclick = function(){ call("act", "back"); };
$("b-home").onclick = function(){ call("act", "home"); toast("New chat"); };
$("b-reload").onclick = function(){ call("act", "reload"); };
$("b-mini").onclick = function(){ call("act", "mini"); };
$("b-pin").onclick = function(){ call("act", "pin"); };
$("b-min").onclick = function(){ call("act", "min"); };
$("b-max").onclick = function(){ call("act", "max"); };
$("b-close").onclick = function(){ call("act", "close"); };
$("b-split").onclick = function(){ call("split", S.cfg.split >= 3 ? 1 : S.cfg.split + 1); };
$("b-upd").onclick = function(){ call("openUpdate"); };
$("t-ask").onclick = function(){ toggleAsk(); };
$("askX").onclick = function(){ toggleAsk(false); };
var askOpen = false;
function toggleAsk(v){
  askOpen = v === undefined ? !askOpen : v;
  $("ask").hidden = !askOpen; $("t-ask").classList.toggle("on", askOpen);
  call("ui", { ask: askOpen });
  if (askOpen) setTimeout(function(){ $("askIn").focus(); }, 50);
}
$("ask").onsubmit = function(e){
  e.preventDefault();
  var t = $("askIn").value.trim(); if (!t) return;
  $("askIn").value = ""; call("askAll", t);
};

/* ---------- side by side ---------- */
var COLS = { cols: [], top: 52, focused: null };
function drawCols(){
  var el = $("cols");
  if (!S || COLS.cols.length < 2) { el.innerHTML = ""; el.hidden = true; return; }
  el.hidden = false; el.style.top = COLS.top + "px";
  el.innerHTML = COLS.cols.map(function(c, i){
    var a = aiOf(c.ai);
    return "<div class=\"col" + (c.ai === COLS.focused ? " on" : "") + "\" data-col=\"" + c.ai + "\" style=\"left:" + c.x + "px;width:" + c.width + "px\"><i style=\"background:" + a.color + "\"></i>" + a.label +
      (S.cfg.split === 2 && i === 1 ? "<button class=\"cy\" data-cy=\"1\" title=\"Change AI\">&#8644;</button>" : "") + "</div>";
  }).join("");
}
$("cols").addEventListener("click", function(e){
  if (e.target.dataset.cy) { call("cycleSecond"); return; }
  var c = e.target.closest(".col"); if (c) call("focusCol", c.dataset.col);
});
["chats","prompts","layout","style"].forEach(function(t){ $("t-" + t).onclick = function(){ toggleDrawer(t); }; });

/* ---------- drawer ---------- */
function toggleDrawer(t){ if (open && tab === t) closeDrawer(); else openDrawer(t); }
function openDrawer(t){
  tab = t || tab; open = true;
  $("drawer").classList.add("open");
  call("ui", { drawer: true });
  render();
}
function closeDrawer(){ open = false; $("drawer").classList.remove("open"); call("ui", { drawer: false }); render(); }
$("d-close").onclick = closeDrawer;
Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.onclick = function(){ tab = b.dataset.tab; render(); }; });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") { if (open) closeDrawer(); else if (askOpen) toggleAsk(false); } });

function renderTab(){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.classList.toggle("on", b.dataset.tab === tab); });
  var body = $("dbody");
  if (body.dataset.tab !== tab) { body.dataset.tab = tab; body.scrollTop = 0; }
  if (tab === "chats") renderChats();
  if (tab === "prompts") renderPrompts();
  if (tab === "layout") renderLayout();
  if (tab === "style") renderStyle();
}

/* ---------- chats + time ---------- */
function dayKey(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dur(s){ var m = Math.round(s / 60), h = Math.floor(m / 60); return h ? h + "h " + String(m % 60).padStart(2, "0") + "m" : m + "m"; }
function sum(o){ var t = 0; for (var k in o) t += o[k]; return t; }
function renderChats(){
  var body = $("dbody");
  var days = [], max = 1, week = 0, perAi = {};
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var st = S.stats[dayKey(d)] || {}, t = sum(st);
    for (var k in st) perAi[k] = (perAi[k] || 0) + st[k];
    days.push({ d: d, t: t }); week += t; if (t > max) max = t;
  }
  var today = days[6].t;
  var bars = days.map(function(x){ return "<div><i style=\"height:" + Math.max(4, Math.round(x.t / max * 44)) + "px\"></i><span>" + x.d.toLocaleDateString(undefined, { weekday: "narrow" }) + "</span></div>"; }).join("");
  var split = S.ais.map(function(a){ var v = perAi[a.id] || 0; return v ? "<i style=\"display:block;width:" + (v / week * 100) + "%;background:" + a.color + "\"></i>" : ""; }).join("");
  var legend = S.ais.map(function(a){ return "<span><b style=\"background:" + a.color + "\"></b>" + a.label + " " + dur(perAi[a.id] || 0) + "</span>"; }).join("");
  body.innerHTML =
    "<div class=\"sec\"><div class=\"card\"><div class=\"stat\"><div><div class=\"muted\">Today</div><div class=\"big\">" + dur(today) + "</div><div class=\"muted\">" + dur(week) + " this week</div></div><div class=\"bars\">" + bars + "</div></div>" +
    (week ? "<div class=\"split\">" + split + "</div><div class=\"legend\">" + legend + "</div>" : "") + "</div></div>" +
    "<div class=\"sec\"><div class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><b>Daily goal</b><span class=\"muted\">" + (S.cfg.goal ? dur(today) + " / " + dur(S.cfg.goal * 60) : "Off") + "</span></div>" +
      (S.cfg.goal ? "<div class=\"goal\"><i style=\"width:" + Math.min(100, today / (S.cfg.goal * 60) * 100) + "%\"></i></div>" : "") +
      "<div class=\"row\" style=\"margin-top:10px;gap:6px\">" + [[0,"Off"],[30,"30m"],[60,"1h"],[120,"2h"],[180,"3h"]].map(function(g){ return "<button class=\"chip" + (S.cfg.goal === g[0] ? " on" : "") + "\" data-goal=\"" + g[0] + "\">" + g[1] + "</button>"; }).join("") + "</div></div></div>" +
    "<div class=\"sec\"><input class=\"field\" id=\"q\" placeholder=\"Search your chats\" value=\"" + esc(q) + "\"><div id=\"hlist\"></div></div>" +
    "<div class=\"sec\"><div class=\"row\"><button class=\"chip\" id=\"clearH\">" + (armed.clear ? "Click again to clear" : "Clear history") + "</button></div></div>";
  $("q").oninput = function(e){ q = e.target.value; renderList(); };
  Array.prototype.forEach.call(body.querySelectorAll("[data-goal]"), function(b){ b.onclick = function(){ set({ goal: +b.dataset.goal, goalDay: "" }); }; });
  $("clearH").onclick = function(){
    if (!armed.clear) { armed.clear = true; renderChats(); setTimeout(function(){ armed.clear = false; if (tab === "chats" && open) renderChats(); }, 2500); return; }
    armed.clear = false; call("clearHistory"); toast("History cleared");
  };
  renderList();
}
function renderList(){
  var el = $("hlist"); if (!el) return;
  var list = S.history.filter(function(h){ return !q || h.title.toLowerCase().indexOf(q.toLowerCase()) > -1; });
  if (!list.length) { el.innerHTML = "<div class=\"empty\">" + (q ? "No chats found" : "Your chats show up here") + "</div>"; return; }
  var now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var groups = [["Today", t0], ["Yesterday", t0 - 864e5], ["This week", t0 - 6 * 864e5], ["Earlier", 0]];
  var html = "", gi = -1;
  var pins = list.filter(function(h){ return h.pinned; });
  if (pins.length) { html += "<div class=\"group\">Pinned</div>"; pins.forEach(function(h){ html += itemHtml(h, new Date(h.time).toLocaleDateString([], { day: "numeric", month: "short" })); }); }
  list.filter(function(h){ return !h.pinned; }).slice(0, 200).forEach(function(h){
    var g = 0; while (h.time < groups[g][1]) g++;
    if (g !== gi) { gi = g; html += "<div class=\"group\">" + groups[g][0] + "</div>"; }
    var d = new Date(h.time);
    var tm = g < 2 ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleDateString([], { day: "numeric", month: "short" });
    html += itemHtml(h, tm);
  });
  el.innerHTML = html;
}
function itemHtml(h, tm){
  return "<button class=\"hitem\" data-url=\"" + esc(h.url) + "\" data-ai=\"" + h.ai + "\"><i class=\"d\" style=\"background:" + aiOf(h.ai).color + "\"></i><span class=\"tt\">" + esc(h.title) + "</span><span class=\"tm\">" + tm + "</span><span class=\"pin" + (h.pinned ? " on" : "") + "\" data-pin=\"1\" title=\"Pin\">&#9733;</span><span class=\"x\" data-rm=\"1\" title=\"Remove\">&times;</span></button>";
}
$("dbody").addEventListener("click", function(e){
  var it = e.target.closest(".hitem"); if (!it) return;
  if (e.target.dataset.rm) { call("removeHistory", it.dataset.url); return; }
  if (e.target.dataset.pin) { call("pinHistory", it.dataset.url); return; }
  call("open", it.dataset.ai, it.dataset.url);
  if (window.innerWidth < 760) closeDrawer();
});

/* ---------- prompts ---------- */
var adding = false;
function renderPrompts(){
  var body = $("dbody");
  var list = S.prompts.map(function(p){
    return "<div class=\"pcard\"><div class=\"pt\"><span>" + esc(p.title) + "</span><button class=\"use\" data-use=\"" + p.id + "\">Use</button><button class=\"del\" data-del=\"" + p.id + "\" title=\"Delete\">&times;</button></div><p>" + esc(p.text.trim()) + "</p></div>";
  }).join("");
  body.innerHTML =
    "<div class=\"sec\">" + (adding
      ? "<div class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\"><input class=\"field\" id=\"pTitle\" placeholder=\"Name\" maxlength=\"40\"><textarea class=\"field\" id=\"pText\" placeholder=\"Your prompt\"></textarea><div class=\"row\"><button class=\"chip white\" id=\"pSave\">Save</button><button class=\"chip\" id=\"pCancel\">Cancel</button></div></div>"
      : "<button class=\"chip white\" id=\"pAdd\" style=\"align-self:flex-start\">+ New prompt</button>") + "</div>" +
    "<div class=\"sec\">" + (list || "<div class=\"empty\">No prompts yet</div>") + "</div>";
  if (adding) {
    $("pTitle").focus();
    $("pSave").onclick = function(){
      var t = $("pTitle").value.trim(), x = $("pText").value;
      if (!t || !x.trim()) { toast("Add a name and a prompt"); return; }
      S.prompts = [{ id: "p" + Date.now(), title: t, text: x }].concat(S.prompts);
      call("savePrompts", S.prompts); adding = false; renderPrompts(); toast("Prompt saved");
    };
    $("pCancel").onclick = function(){ adding = false; renderPrompts(); };
  } else $("pAdd").onclick = function(){ adding = true; renderPrompts(); };
  Array.prototype.forEach.call(body.querySelectorAll("[data-use]"), function(b){ b.onclick = function(){
    var p = S.prompts.filter(function(x){ return x.id === b.dataset.use; })[0];
    if (window.innerWidth < 760) closeDrawer();
    call("usePrompt", p.text);
  }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-del]"), function(b){ b.onclick = function(){
    S.prompts = S.prompts.filter(function(x){ return x.id !== b.dataset.del; }); call("savePrompts", S.prompts); renderPrompts();
  }; });
}

/* ---------- size & place ---------- */
function tileHtml(key, r, on){
  return "<button class=\"tile" + (on ? " on" : "") + "\" data-size=\"" + key + "\"><div class=\"scr\"><i style=\"left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%\"></i></div><span>" + S.sizeNames[key] + "</span></button>";
}
function toggle(key, label, sub){
  return "<label class=\"tg\"><span>" + label + (sub ? "<small>" + sub + "</small>" : "") + "</span><input type=\"checkbox\" data-key=\"" + key + "\"" + (S.cfg[key] ? " checked" : "") + "><span class=\"k\"></span></label>";
}
function renderLayout(){
  var c = S.cfg, body = $("dbody");
  var fixed = ["mini","small","medium","large","xl","custom"].indexOf(c.size) > -1;
  body.innerHTML =
    "<div class=\"sec\"><div class=\"lbl\">Side by side</div><div class=\"row\">" + [[1,"One AI"],[2,"Two"],[3,"All three"]].map(function(s){ return "<button class=\"chip" + (c.split === s[0] ? " on" : "") + "\" data-split=\"" + s[0] + "\">" + s[1] + "</button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Size</div><div class=\"tiles\">" + TILES.map(function(t){ return tileHtml(t[0], t[1], c.size === t[0]); }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Place</div><div class=\"row\" style=\"gap:14px;align-items:flex-start\"><div class=\"pos\">" +
      POS.map(function(p){ return "<button data-pos=\"" + p + "\" class=\"" + (fixed && c.position === p ? "on" : "") + "\" aria-label=\"" + p + "\"></button>"; }).join("") +
    "</div><div class=\"muted\" style=\"flex:1\">Or drag the top bar.<br>It remembers the spot.</div></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Custom</div><div class=\"wh\"><input class=\"field\" type=\"number\" id=\"cw\" min=\"360\" value=\"" + c.width + "\" aria-label=\"Width\"><span class=\"muted\">&times;</span><input class=\"field\" type=\"number\" id=\"ch\" min=\"420\" value=\"" + c.height + "\" aria-label=\"Height\"><button class=\"chip white\" id=\"cset\">Set</button></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Text size</div><div class=\"zoom\"><button class=\"chip\" id=\"zo\">A&minus;</button><b>" + c.zoom + "%</b><button class=\"chip\" id=\"zi\">A+</button><button class=\"chip\" id=\"zr\">Reset</button></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">See-through " + c.opacity + "%</div><input type=\"range\" id=\"op\" min=\"40\" max=\"100\" step=\"5\" value=\"" + c.opacity + "\"></div>" +
    "<div class=\"sec\"><div class=\"card\">" + toggle("alwaysOnTop", "Keep on top", "Stays above other windows") +
      "<label class=\"tg\"><span>Mini mode<small>Small, in the corner, on top</small></span><input type=\"checkbox\" id=\"mm\"" + (c.mini ? " checked" : "") + "><span class=\"k\"></span></label></div></div>";
  Array.prototype.forEach.call(body.querySelectorAll("[data-size]"), function(b){ b.onclick = function(){ set({ size: b.dataset.size }); }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-split]"), function(b){ b.onclick = function(){ call("split", +b.dataset.split); }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-pos]"), function(b){ b.onclick = function(){ set(fixed ? { position: b.dataset.pos } : { size: "medium", position: b.dataset.pos }); }; });
  $("cset").onclick = function(){ set({ size: "custom", position: "center", width: +$("cw").value || 860, height: +$("ch").value || 760 }); };
  $("zo").onclick = function(){ call("act", "zoomOut"); };
  $("zi").onclick = function(){ call("act", "zoomIn"); };
  $("zr").onclick = function(){ set({ zoom: 100 }); };
  $("op").onchange = function(e){ set({ opacity: +e.target.value }); };
  $("mm").onchange = function(){ call("act", "mini"); };
  bindToggles(body);
}
function bindToggles(body){
  Array.prototype.forEach.call(body.querySelectorAll("input[data-key]"), function(i){ i.onchange = function(){ var p = {}; p[i.dataset.key] = i.checked; set(p); }; });
}

/* ---------- style ---------- */
function rr(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); }
function drawIcon(){
  var cv = $("cv"); if (!cv) return;
  var x = cv.getContext("2d"), S2 = 256, col = COLORS[ic.col];
  x.clearRect(0, 0, S2, S2);
  var g = x.createLinearGradient(0, 0, S2, S2); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]); x.fillStyle = g;
  x.save();
  if (ic.shape === "Circle") { x.beginPath(); x.arc(128, 128, 128, 0, 7); x.fill(); }
  else if (ic.shape === "Diamond") { x.translate(128, 128); x.rotate(Math.PI / 4); rr(x, -90, -90, 180, 180, 36); x.fill(); x.setTransform(1, 0, 0, 1, 0, 0); }
  else { rr(x, 0, 0, S2, S2, ic.shape === "Squircle" ? 96 : 56); x.fill(); }
  x.restore();
  var t = (ic.glyph || S.cfg.name || "E").trim().slice(0, 2) || "E";
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "800 " + (t.length > 1 ? 104 : 136) + "px system-ui,-apple-system,Segoe UI,sans-serif";
  x.shadowColor = "rgba(0,0,0,.25)"; x.shadowBlur = 18; x.shadowOffsetY = 6;
  x.fillText(t, 128, 134);
}
function renderStyle(){
  var c = S.cfg, body = $("dbody");
  var keys = [["Switch AI", (S.isMac ? "⌘" : "Ctrl") + " 1 / 2 / 3"], ["Show / hide app", S.hotkeyLabel], ["Chats", (S.isMac ? "⌘ ⇧" : "Ctrl Shift") + " H"], ["Size", (S.isMac ? "⌘ ⇧" : "Ctrl Shift") + " L"], ["Mini mode", (S.isMac ? "⌘ ⇧" : "Ctrl Shift") + " M"], ["New chat", (S.isMac ? "⌘ ⇧" : "Ctrl Shift") + " O"], ["Text size", (S.isMac ? "⌘" : "Ctrl") + " + / −"], ["Snap left / right", (S.isMac ? "⌘ ⌥" : "Ctrl Alt") + " ← / →"], ["Full screen", (S.isMac ? "⌘ ⌥" : "Ctrl Alt") + " ↑"]];
  body.innerHTML =
    "<div class=\"sec\"><div class=\"lbl\">Name</div><input class=\"field\" id=\"nm\" maxlength=\"40\" value=\"" + esc(c.name) + "\"></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Icon</div><div class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\"><div class=\"iconrow\"><canvas id=\"cv\" width=\"256\" height=\"256\"></canvas><div style=\"flex:1;display:flex;flex-direction:column;gap:8px;min-width:0\"><input class=\"field\" id=\"gl\" maxlength=\"2\" placeholder=\"Letters\" value=\"" + esc(ic.glyph) + "\"><div class=\"row\" style=\"gap:6px\">" +
      COLORS.map(function(p, i){ return "<button class=\"sw" + (ic.col === i ? " on" : "") + "\" data-icol=\"" + i + "\" style=\"background:linear-gradient(135deg," + p[0] + "," + p[1] + ")\" aria-label=\"Icon colour\"></button>"; }).join("") +
    "</div></div></div><div class=\"row\" style=\"gap:6px\">" + SHAPES.map(function(s){ return "<button class=\"chip" + (ic.shape === s ? " on" : "") + "\" data-ishape=\"" + s + "\">" + s + "</button>"; }).join("") +
    "</div><div class=\"row\"><button class=\"chip white\" id=\"iu\">Use icon</button><button class=\"chip\" id=\"ip\">Upload</button><button class=\"chip\" id=\"id\">Default</button></div></div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Colour</div><div class=\"row\">" + ACCENTS.map(function(a){ return "<button class=\"sw" + (c.accent === a ? " on" : "") + "\" data-acc=\"" + a + "\" style=\"background:" + a + "\" aria-label=\"Colour\"></button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Top bar</div><div class=\"row\">" + [["aurora","Aurora"],["midnight","Midnight"],["black","Black"]].map(function(t){ return "<button class=\"chip" + (c.theme === t[0] ? " on" : "") + "\" data-theme=\"" + t[0] + "\">" + t[1] + "</button>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Easy use</div><div class=\"card\">" +
      toggle("keepSignedIn", "Stay signed in", "Log in once") + toggle("resume", "Open last chat", "Start where you left off") +
      toggle("hotkey", "Show / hide shortcut", S.hotkeyLabel) + toggle("startup", "Start with computer") + toggle("closeToTray", "Keep running when closed") + toggle("autoHide", "Hide when I click away", "Great with the shortcut") +
    "</div></div>" +
    "<div class=\"sec\"><div class=\"lbl\">Shortcuts</div><div class=\"keys\">" + keys.map(function(k){ return "<span>" + k[0] + "</span><kbd>" + k[1] + "</kbd>"; }).join("") + "</div></div>" +
    "<div class=\"sec\"><div class=\"row\"><button class=\"chip\" id=\"rs\">" + (armed.reset ? "Click again to reset" : "Reset settings") + "</button><button class=\"chip\" id=\"wl\">Show welcome</button></div></div>";
  drawIcon();
  $("nm").onchange = function(e){ set({ name: e.target.value.trim() || "Exacct AI" }); };
  $("gl").oninput = function(e){ ic.glyph = e.target.value; drawIcon(); };
  Array.prototype.forEach.call(body.querySelectorAll("[data-icol]"), function(b){ b.onclick = function(){ ic.col = +b.dataset.icol; renderStyle(); }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-ishape]"), function(b){ b.onclick = function(){ ic.shape = b.dataset.ishape; renderStyle(); }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-acc]"), function(b){ b.onclick = function(){ set({ accent: b.dataset.acc }); }; });
  Array.prototype.forEach.call(body.querySelectorAll("[data-theme]"), function(b){ b.onclick = function(){ set({ theme: b.dataset.theme }); }; });
  $("iu").onclick = function(){ set({ icon: $("cv").toDataURL("image/png") }).then(function(){ toast("New icon"); }); };
  $("ip").onclick = function(){ call("pickIcon").then(function(d){ if (d) set({ icon: d }).then(function(){ toast("New icon"); }); }); };
  $("id").onclick = function(){ set({ icon: null }); };
  $("rs").onclick = function(){
    if (!armed.reset) { armed.reset = true; renderStyle(); setTimeout(function(){ armed.reset = false; if (tab === "style" && open) renderStyle(); }, 2500); return; }
    armed.reset = false; call("reset").then(function(s){ S = s; render(); toast("Settings reset"); });
  };
  $("wl").onclick = function(){ closeDrawer(); showWelcome(); };
  bindToggles(body);
}

/* ---------- welcome ---------- */
var w = { step: 0, ai: null, name: "", accent: null, size: "medium" };
var WSIZES = ["mini","medium","large","left","right","full"];
function showWelcome(){
  w = { step: 0, ai: S.cfg.ai, name: S.cfg.name, accent: S.cfg.accent, size: "medium" };
  $("welcome").hidden = false; call("ui", { welcome: true }); drawWelcome();
}
function drawWelcome(){
  var b = $("wbox"), dots = "<div class=\"dots\">" + [0,1,2,3,4].map(function(i){ return "<i class=\"" + (i === w.step ? "on" : "") + "\"></i>"; }).join("") + "</div>";
  var back = w.step ? "<button class=\"link\" id=\"wb\">Back</button>" : "";
  var html = "";
  if (w.step === 0) html = "<img class=\"hero\" src=\"" + iconSrc() + "\" alt=\"\"><h1>Welcome to<br>" + esc(S.cfg.name) + "</h1><button class=\"big-btn\" id=\"wn\">Start</button>";
  if (w.step === 1) html = "<h1>Pick your AI</h1><div class=\"aipick\">" + S.ais.map(function(a){ return "<button data-wai=\"" + a.id + "\" class=\"" + (w.ai === a.id ? "on" : "") + "\"><i style=\"background:" + a.color + "\"></i>" + a.label + "</button>"; }).join("") + "</div><button class=\"big-btn\" id=\"wn\">Next</button>";
  if (w.step === 2) html = "<h1>Name it</h1><input class=\"field\" id=\"wname\" maxlength=\"40\" value=\"" + esc(w.name) + "\" style=\"text-align:center;font-size:17px;font-weight:700\"><div class=\"row\" style=\"justify-content:center\">" + ACCENTS.map(function(a){ return "<button class=\"sw" + (w.accent === a ? " on" : "") + "\" data-wacc=\"" + a + "\" style=\"background:" + a + "\"></button>"; }).join("") + "</div><button class=\"big-btn\" id=\"wn\">Next</button>";
  if (w.step === 3) html = "<h1>Pick a size</h1><div class=\"tiles wtiles\">" + WSIZES.map(function(k){ var r = TILES.filter(function(t){ return t[0] === k; })[0][1]; return tileHtml(k, r, w.size === k); }).join("") + "</div><button class=\"big-btn\" id=\"wn\">Next</button>";
  if (w.step === 4) html = "<img class=\"hero\" src=\"" + iconSrc() + "\" alt=\"\"><h1>Log in once.<br>We remember you.</h1><button class=\"big-btn\" id=\"wn\">Open " + esc(aiOf(w.ai).label) + "</button>";
  b.innerHTML = "<div class=\"wstep\">" + html + dots + back + "</div>";
  document.documentElement.style.setProperty("--accent", w.accent);
  if ($("wb")) $("wb").onclick = function(){ w.step--; drawWelcome(); };
  if ($("wname")) $("wname").oninput = function(e){ w.name = e.target.value; };
  Array.prototype.forEach.call(b.querySelectorAll("[data-wai]"), function(x){ x.onclick = function(){ w.ai = x.dataset.wai; drawWelcome(); }; });
  Array.prototype.forEach.call(b.querySelectorAll("[data-wacc]"), function(x){ x.onclick = function(){ w.accent = x.dataset.wacc; drawWelcome(); }; });
  Array.prototype.forEach.call(b.querySelectorAll("[data-size]"), function(x){ x.onclick = function(){ w.size = x.dataset.size; drawWelcome(); }; });
  $("wn").onclick = function(){
    if (w.step < 4) { w.step++; drawWelcome(); return; }
    $("welcome").hidden = true;
    set({ ai: w.ai, name: (w.name || "").trim() || "Exacct AI", accent: w.accent, size: w.size, position: "center", welcomed: true })
      .then(function(){ call("ui", { welcome: false }); });
  };
}

/* ---------- events ---------- */
window.exacct.on("state", function(s){ S = s; render(); });
window.exacct.on("history", function(h){ if (!S) return; S.history = h; if (open && tab === "chats") renderList(); });
window.exacct.on("nav", function(n){ $("b-back").disabled = !n.canBack; });
window.exacct.on("loading", function(l){ document.body.classList.toggle("loading", !!l); });
window.exacct.on("toast", toast);
window.exacct.on("drawer", function(t){ toggleDrawer(t); });
window.exacct.on("cols", function(c){ COLS = c; drawCols(); });
call("state").then(function(s){ S = s; render(); if (!S.cfg.welcomed) showWelcome(); });
</script>
</body>
