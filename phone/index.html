<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expecct">
<title>Expecct</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0d;--card:#15151b;--card2:#1d1d25;--fg:#f2f2f5;--muted:#8a8a96;--line:rgba(255,255,255,.08);--accent:#8b5cf6;--pink:#ec4899;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 88px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(80% 40% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header b{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ask textarea{width:100%;min-height:84px;max-height:220px;resize:none;background:transparent;border:0;outline:none;padding:4px 6px;font-size:17px}
.ask textarea::placeholder{color:var(--muted)}
.sendrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.send{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 6px;border-radius:14px;background:var(--card2);font-weight:700;font-size:14px;transition:transform .1s}
.send:active{transform:scale(.96)}
.send i{width:9px;height:9px;border-radius:50%}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px}
.ais{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ai{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:700;font-size:14px;transition:transform .1s}
.ai:active{transform:scale(.96)}
.ai span{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;background:transparent;width:100%}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item i{width:8px;height:8px;border-radius:50%;flex:none}
.item small{color:var(--muted);font-size:12px;flex:none}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,120px);background:#fff;color:#0a0a0d;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;transition:transform .3s cubic-bezier(.3,1.4,.5,1);z-index:30;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:560px;background:#121217;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:16px;animation:up .25s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:19px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;font-weight:700}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{width:100%;padding:15px;border-radius:16px;background:#fff;color:#0a0a0d;font-weight:800;font-size:16px}
.steps{margin:0;padding-left:20px;color:#d4d4d8;display:flex;flex-direction:column;gap:8px}
.steps b{color:#fff}
.install{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,var(--card)),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.install img{width:40px;height:40px;border-radius:10px}
.install div{flex:1;font-weight:700;font-size:14px}
.install button{padding:9px 14px;border-radius:999px;background:#fff;color:#0a0a0d;font-weight:800;font-size:14px}
.sendrow.d4{grid-template-columns:repeat(4,1fr)}
.send.all{background:#fff;color:#0a0a0d}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sz{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.sz.on{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 1px var(--accent)}
.sz .scr{position:relative;width:44px;height:28px;border-radius:4px;background:rgba(255,255,255,.07)}
.sz .scr i{position:absolute;border-radius:2px;background:var(--muted)}
.sz.on .scr i{background:var(--accent)}
@media (min-width:700px){.wrap{max-width:640px}body{padding-top:28px}}
@media (max-width:560px){.sizes{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" src="icon-192.png" alt="">
    <b id="name">Expecct</b>
    <button class="icon-btn" id="styleBtn" aria-label="Style"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5l1.6 3.9 4 .3-3.1 2.6 1 4L8 10.1 4.5 12.3l1-4L2.4 5.7l4-.3z"/></svg></button>
  </header>

  <div class="install" id="install" hidden><img src="icon-192.png" alt=""><div id="installT">Add to your home screen</div><button id="installBtn">Add</button></div>

  <div class="ask">
    <textarea id="q" placeholder="Ask anything…" rows="3" autofocus></textarea>
    <div class="sendrow" id="sendrow"></div>
  </div>

  <div class="lbl desk" hidden>Window size</div>
  <div class="sizes desk" id="sizes" hidden></div>

  <div class="lbl">Open</div>
  <div class="ais" id="ais"></div>

  <div class="lbl">Prompts</div>
  <div class="chips" id="prompts"></div>

  <div class="lbl">Recent</div>
  <div class="list" id="recent"></div>
</div>

<div class="sheet" id="styleSheet" hidden><div>
  <h2>Style</h2>
  <input class="field" id="nm" maxlength="24" aria-label="Name">
  <div class="row" id="accs"></div>
  <button class="big" id="styleDone">Done</button>
</div></div>

<div class="sheet" id="popSheet" hidden><div>
  <h2>Allow pop-ups once</h2>
  <ol class="steps"><li>Click the <b>blocked pop-up</b> icon at the right of the address bar</li><li>Choose <b>Always allow</b></li><li>Try again</li></ol>
  <button class="big" id="popDone">OK</button>
</div></div>

<div class="sheet" id="iosSheet" hidden><div>
  <h2>Add to home screen</h2>
  <ol class="steps"><li>Tap <b>Share</b> at the bottom of Safari</li><li>Tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b></li></ol>
  <button class="big" id="iosDone">OK</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
var AIS = [
  { id: "chatgpt", label: "ChatGPT", short: "Gp", color: "#10a37f", open: "https://chatgpt.com/", ask: function(t){ return "https://chatgpt.com/?q=" + encodeURIComponent(t); } },
  { id: "claude", label: "Claude", short: "Cl", color: "#d97757", open: "https://claude.ai/new", ask: function(t){ return "https://claude.ai/new?q=" + encodeURIComponent(t); } },
  { id: "gemini", label: "Gemini", short: "Ge", color: "#4f8cff", open: "https://gemini.google.com/app", ask: null }
];
var ACCENTS = ["#8b5cf6","#ec4899","#10a37f","#d97757","#4f8cff","#06b6d4","#f59e0b","#ef4444"];
var PROMPTS = [["Explain simply","Explain this in simple words, like I'm 12: "],["Fix my text","Fix the spelling and grammar in this text: "],["Summarize","Summarize this in 5 short bullet points: "],["Translate","Translate this to Norwegian: "],["Ideas","Give me 10 creative ideas for: "],["Write code","Write clean code that does this: "]];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function load(k, d){ try { var v = JSON.parse(localStorage.getItem("exacct." + k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v){ try { localStorage.setItem("exacct." + k, JSON.stringify(v)); } catch (e) {} }
var cfg = load("cfg", { name: "Expecct", accent: "#8b5cf6", size: "medium" });
if (!cfg.size) cfg.size = "medium";
if (cfg.name === "Exacct AI") cfg.name = "Expecct";
var recent = load("recent", []);
var tt;
function toast(t){ var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("show"); }, 2200); }

function applyStyle(){
  document.documentElement.style.setProperty("--accent", cfg.accent);
  $("name").textContent = cfg.name; document.title = cfg.name;
}

/* where are we? phone = open in the same tab, computer = open as its own window */
var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (matchMedia("(pointer: coarse)").matches && innerWidth < 820);
var SIZES = [["small","Small",[66,40,30,56]],["medium","Medium",[25,10,50,80]],["big","Big",[8,5,84,90]],["left","Left",[0,0,50,100]],["right","Right",[50,0,50,100]],["full","Full",[0,0,100,100]]];
var wins = {};
function aiOf(id){ return AIS.filter(function(x){ return x.id === id; })[0]; }
function box(size, slot){
  var W = screen.availWidth, H = screen.availHeight, X = screen.availLeft || 0, Y = screen.availTop || 0, r = Math.round, w, h, x, y;
  if (slot != null) { w = r(W / 3); h = H; x = X + slot * w; y = Y; }
  else if (size === "small") { w = Math.min(460, W); h = Math.min(760, H); x = X + W - w - 16; y = Y + H - h - 16; }
  else if (size === "big") { w = r(W * .84); h = r(H * .9); x = X + r((W - w) / 2); y = Y + r((H - h) / 2); }
  else if (size === "left") { w = r(W / 2); h = H; x = X; y = Y; }
  else if (size === "right") { w = r(W / 2); h = H; x = X + W - w; y = Y; }
  else if (size === "full") { w = W; h = H; x = X; y = Y; }
  else { w = Math.min(960, W); h = Math.min(820, H); x = X + r((W - w) / 2); y = Y + r((H - h) / 2); }
  return "popup=yes,width=" + w + ",height=" + Math.max(300, h - 38) + ",left=" + x + ",top=" + y;
}
function openAI(a, url, slot){
  if (isPhone) { location.href = url; return true; }
  var old = wins[a.id];
  if (old && !old.closed) { try { old.close(); } catch (e) {} }
  var w = window.open(url, "expecct-" + a.id, box(cfg.size, slot));
  if (!w) { $("popSheet").hidden = false; return false; }
  wins[a.id] = w;
  return true;
}
function ask(a, t, slot){
  if (a.ask) return openAI(a, a.ask(t), slot);
  copy(t); toast("Copied – press " + (/Mac/.test(navigator.platform) ? "⌘V" : "Ctrl+V") + " in Gemini");
  return openAI(a, a.open, slot);
}
$("ais").innerHTML = AIS.map(function(a){ return "<a class=\"ai\" href=\"" + a.open + "\" data-open=\"" + a.id + "\" style=\"--c:" + a.color + "\"><span>" + a.short + "</span>" + a.label + "</a>"; }).join("");
Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(el){
  el.onclick = function(e){ if (isPhone) return; e.preventDefault(); openAI(aiOf(el.dataset.open), aiOf(el.dataset.open).open); };
});
$("sendrow").innerHTML = AIS.map(function(a){ return "<button class=\"send\" data-ai=\"" + a.id + "\"><i style=\"background:" + a.color + "\"></i>" + a.label + "</button>"; }).join("") +
  (isPhone ? "" : "<button class=\"send all\" data-ai=\"all\">All 3</button>");
if (!isPhone) $("sendrow").classList.add("d4");
Array.prototype.forEach.call(document.querySelectorAll(".send"), function(b){
  b.onclick = function(){
    var t = $("q").value.trim();
    if (!t) { $("q").focus(); toast("Type your question first"); return; }
    remember(t, b.dataset.ai === "all" ? "chatgpt" : b.dataset.ai);
    if (b.dataset.ai === "all") { for (var i = 0; i < AIS.length; i++) if (!ask(AIS[i], t, i)) return; return; }
    var a = aiOf(b.dataset.ai);
    if (!a.ask && isPhone) { copy(t).then(function(){ toast("Copied – paste it in " + a.label); setTimeout(function(){ location.href = a.open; }, 900); }); return; }
    ask(a, t);
  };
});
$("q").addEventListener("keydown", function(e){ if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { var b = document.querySelector(".send"); if (b) b.click(); } });

/* window size (computer) */
function drawSizes(){
  $("sizes").innerHTML = SIZES.map(function(z){ var r = z[2]; return "<button class=\"sz" + (cfg.size === z[0] ? " on" : "") + "\" data-size=\"" + z[0] + "\"><span class=\"scr\"><i style=\"left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%\"></i></span>" + z[1] + "</button>"; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-size]"), function(b){ b.onclick = function(){ cfg.size = b.dataset.size; save("cfg", cfg); drawSizes(); toast(b.textContent + " – opens like this"); }; });
}
if (!isPhone) { Array.prototype.forEach.call(document.querySelectorAll(".desk"), function(e){ e.hidden = false; }); drawSizes(); }
$("popDone").onclick = function(){ $("popSheet").hidden = true; };

function copy(t){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function(){});
  var x = document.createElement("textarea"); x.value = t; document.body.appendChild(x); x.select();
  try { document.execCommand("copy"); } catch (e) {}
  x.remove(); return Promise.resolve();
}

/* prompts */
$("prompts").innerHTML = PROMPTS.map(function(p, i){ return "<button class=\"chip\" data-p=\"" + i + "\">" + esc(p[0]) + "</button>"; }).join("");
Array.prototype.forEach.call(document.querySelectorAll("[data-p]"), function(b){
  b.onclick = function(){ var q = $("q"); q.value = PROMPTS[+b.dataset.p][1] + q.value; q.focus(); q.setSelectionRange(q.value.length, q.value.length); };
});

/* recent */
function remember(t, ai){
  recent = [{ t: t, ai: ai, at: Date.now() }].concat(recent.filter(function(r){ return r.t !== t; })).slice(0, 30);
  save("recent", recent); drawRecent();
}
function drawRecent(){
  if (!recent.length) { $("recent").innerHTML = "<div class=\"empty\">Your questions show up here</div>"; return; }
  $("recent").innerHTML = recent.slice(0, 12).map(function(r, i){
    var a = AIS.filter(function(x){ return x.id === r.ai; })[0] || AIS[0];
    var d = new Date(r.at);
    return "<button class=\"item\" data-r=\"" + i + "\"><i style=\"background:" + a.color + "\"></i><span class=\"t\">" + esc(r.t) + "</span><small>" + d.toLocaleDateString([], { day: "numeric", month: "short" }) + "</small></button>";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-r]"), function(b){
    b.onclick = function(){ $("q").value = recent[+b.dataset.r].t; $("q").focus(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  });
}

/* style */
$("styleBtn").onclick = function(){
  $("nm").value = cfg.name;
  $("accs").innerHTML = ACCENTS.map(function(a){ return "<button class=\"sw" + (cfg.accent === a ? " on" : "") + "\" data-acc=\"" + a + "\" style=\"background:" + a + "\" aria-label=\"Colour\"></button>"; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-acc]"), function(b){
    b.onclick = function(){ cfg.accent = b.dataset.acc; applyStyle(); Array.prototype.forEach.call(document.querySelectorAll("[data-acc]"), function(x){ x.classList.toggle("on", x === b); }); };
  });
  $("styleSheet").hidden = false;
};
$("nm").oninput = function(e){ cfg.name = e.target.value.trim() || "Expecct"; applyStyle(); };
$("styleDone").onclick = function(){ save("cfg", cfg); $("styleSheet").hidden = true; };
$("styleSheet").onclick = function(e){ if (e.target.id === "styleSheet") $("styleDone").onclick(); };

/* install */
var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
var deferred = null;
if (!isPhone) { $("installT").textContent = "Install Expecct – opens like an app, no download"; $("installBtn").textContent = "Install"; }
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; if (!standalone) $("install").hidden = false; });
if (isIOS && !standalone) $("install").hidden = false;
$("installBtn").onclick = function(){
  if (deferred) { deferred.prompt(); deferred.userChoice.then(function(){ $("install").hidden = true; deferred = null; }); }
  else $("iosSheet").hidden = false;
};
$("iosDone").onclick = function(){ $("iosSheet").hidden = true; };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

applyStyle(); drawRecent();
</script>
</body>
</html>
