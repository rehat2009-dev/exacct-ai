<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expecct</title>
<meta name="description" content="ChatGPT, Claude and Gemini in their own window. Any size, any place, your style.">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#09090b; --surface:#111114; --surface-2:#18181c; --fg:#f4f4f5; --muted:#8b8b94; --line:rgba(255,255,255,.09);
  --accent:#8b5cf6; --pink:#ec4899; --gold:#d6a35c;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;overflow-x:hidden}
[hidden]{display:none!important}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:56px;position:relative;z-index:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;letter-spacing:.5em;text-transform:uppercase;margin:0}
.logo img{width:30px;height:30px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a0a0b;border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:.9rem;text-decoration:none;transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translateY(-2px);box-shadow:0 12px 36px color-mix(in srgb,var(--accent) 55%,transparent)}
.pill svg{width:14px;height:14px}

/* hero */
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:24px}
.hero h1{font-weight:800;font-size:clamp(2.6rem,8vw,5.4rem);line-height:.98;letter-spacing:-.045em;margin:0;text-wrap:balance}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(30px);filter:blur(8px);animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2){animation-delay:.12s}.hero h1 span:nth-child(3){animation-delay:.24s}
.hero h1 .shine{background:linear-gradient(100deg,#fff 15%,#c4b5fd 38%,#f5d9a8 50%,#fff 66%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:in .9s cubic-bezier(.2,.8,.2,1) .24s forwards,shine 5s linear 1.4s infinite}
@keyframes in{to{opacity:1;transform:none;filter:none}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.ais{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;animation:fade .8s ease .6s both}
.ais span{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:#c9c9d1;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.03)}
.ais i{width:8px;height:8px;border-radius:50%}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the screen */
.screen{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;border:1px solid var(--line);overflow:hidden;container-type:inline-size;
  background:radial-gradient(55% 60% at 20% 20%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 70%),radial-gradient(50% 60% at 90% 90%,rgba(214,163,92,.18),transparent 70%),linear-gradient(160deg,#16131f,#0b0b10);
  box-shadow:0 40px 120px -30px color-mix(in srgb,var(--accent) 45%,transparent);animation:fade .9s ease .4s both}
.screen::after{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 70%,var(--accent) 80%,var(--gold) 88%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--ang:360deg}}
.dock{position:absolute;left:50%;bottom:2.2cqw;transform:translateX(-50%);display:flex;gap:1cqw;padding:.8cqw;border-radius:1.6cqw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.dock i{width:3cqw;height:3cqw;border-radius:.8cqw;background:rgba(255,255,255,.12)}
.dock i:first-child{background:linear-gradient(135deg,var(--accent),var(--pink))}
.app{position:absolute;border-radius:1.2cqw;overflow:hidden;background:#0c0c10;border:1px solid rgba(255,255,255,.14);box-shadow:0 2cqw 6cqw rgba(0,0,0,.55);
  transition:left .8s cubic-bezier(.3,1.15,.4,1),top .8s cubic-bezier(.3,1.15,.4,1),width .8s cubic-bezier(.3,1.15,.4,1),height .8s cubic-bezier(.3,1.15,.4,1),border-radius .8s;display:flex;flex-direction:column}
.app.edge{border-radius:0}
.abar{height:max(3.4cqw,16px);flex:none;display:flex;align-items:center;gap:.8cqw;padding:0 1cqw;background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 35%,#0d0c12),#0d0c12 60%,color-mix(in srgb,var(--pink) 18%,#0d0c12));border-bottom:1px solid rgba(255,255,255,.08);transition:background .5s}
.aicon{width:max(2cqw,10px);height:max(2cqw,10px);border-radius:28%;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;color:#fff;font-weight:800;font-size:max(1.1cqw,6px);transition:border-radius .4s,transform .4s,background .4s;flex:none}
.aicon.circle{border-radius:50%}.aicon.squircle{border-radius:38%}.aicon.diamond{border-radius:22%;transform:rotate(45deg) scale(.85)}
.aicon.diamond b{transform:rotate(-45deg)}
.aname{font-weight:800;font-size:max(1.1cqw,6px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20cqw}
.aswitch{margin:0 auto;display:flex;gap:.4cqw;padding:.3cqw;border-radius:9cqw;background:rgba(255,255,255,.07)}
.aswitch i{width:max(1.1cqw,5px);height:max(1.1cqw,5px);border-radius:50%}
.aswitch i.on{box-shadow:0 0 0 max(.3cqw,1.5px) #fff}
.abody{flex:1;padding:1.6cqw;display:flex;flex-direction:column;gap:1.2cqw;min-height:0}
.msg{height:max(1.6cqw,7px);border-radius:1cqw;background:rgba(255,255,255,.1);animation:pulse 2.4s ease-in-out infinite}
.msg.me{align-self:flex-end;width:40%;background:color-mix(in srgb,var(--accent) 55%,transparent)}
.msg.w1{width:85%}.msg.w2{width:70%;animation-delay:.3s}.msg.w3{width:55%;animation-delay:.6s}
@keyframes pulse{50%{opacity:.55}}
.ainput{margin-top:auto;height:max(3cqw,12px);border-radius:2cqw;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.sizetag{margin-top:-6px;font-size:.85rem;font-weight:800;background:#fff;color:#0a0a0b;border-radius:99px;padding:6px 16px;min-width:110px;text-align:center;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent)}

/* size tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(7,1fr)}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 8px 7px;display:flex;flex-direction:column;gap:6px;transition:all .2s}
.tile:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25)}
.tile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));box-shadow:0 0 0 1px var(--accent)}
.scr{position:relative;aspect-ratio:16/10;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);overflow:hidden}
.scr i{position:absolute;border-radius:3px;background:linear-gradient(135deg,var(--accent),var(--pink))}
.tile span{font-size:.72rem;font-weight:700;color:#d4d4d8;text-align:center}

.label{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.32em;text-transform:uppercase;scroll-margin-top:24px}
.label::before,.label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(214,163,92,.45),transparent)}
.sec{display:flex;flex-direction:column;gap:20px}
.big{font-weight:800;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.035em;line-height:1.05;margin:0;text-align:center;text-wrap:balance}

/* style studio */
.studio{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.studio{grid-template-columns:1fr}}
.studio .screen{aspect-ratio:4/3;animation:none}
.ctrl{display:flex;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.ctrl .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;transition:transform .15s}
.sw.on{border-color:#fff;transform:scale(1.15)}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:700;transition:all .15s}
.chip.on{background:#fff;color:#0a0a0b;border-color:#fff}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--fg);font:inherit;font-weight:700;outline:none}
.field:focus{border-color:var(--accent)}

/* features */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.feat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:700;font-size:.9rem;transition:border-color .2s,transform .2s}
.feat:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-2px)}
.feat svg{width:20px;height:20px;flex:none;color:var(--accent)}

/* download */
.dlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;transition:border-color .2s,transform .2s}
.dcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.dtop{display:flex;align-items:center;gap:12px}
.dtop img{width:46px;height:46px}
.dtop b{display:block;font-size:1.05rem}
.dtop small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.dtop small i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dls{display:flex;gap:8px}
.dl{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:10px;font-weight:700;font-size:.85rem;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--surface-2);transition:transform .2s,box-shadow .2s}
.dl svg{width:14px;height:14px}
.dl.main{background:#fff;color:#0a0a0b;border-color:#fff}
.dl:hover{transform:translateY(-2px);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 50%,transparent)}
.webapp{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 26%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.webapp img{width:54px;height:54px}
.webapp .wt{flex:1;min-width:0}
.webapp .wt b{display:block;font-size:1.15rem}
.webapp .wt span{color:var(--muted);font-weight:600;font-size:.86rem}
.webapp .open{flex:none;display:flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;background:#fff;color:#0a0a0b;font-weight:800;font-size:.95rem;text-decoration:none;transition:transform .15s}
.webapp .open:hover{transform:translateY(-2px);box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 45%,transparent)}
.webapp .open svg{width:16px;height:16px}
.dlor{color:var(--muted);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin:4px 2px 12px}
@media(max-width:560px){.webapp{flex-wrap:wrap}.webapp .open{flex:1 1 100%;justify-content:center}}
footer{text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.35em;text-transform:uppercase}

/* download help */
.dlhelp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,5,8,.72);backdrop-filter:blur(8px);animation:fade .25s ease both}
.dlbox{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlbox h3{margin:0;font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:12px}
.dlbox h3 img{width:42px;height:42px}
.dlbox ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.dlbox li{display:flex;gap:12px;align-items:center;color:#d4d4d8;font-size:.92rem;counter-increment:s}
.dlbox li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:#fff;color:#0a0a0b}
.dlbox li b{color:#fff}
.dlbar{height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.dlbar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--pink),var(--gold));border-radius:9px;animation:mv 1.2s ease-in-out infinite}
@keyframes mv{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.dlbox .row{display:flex;gap:8px}
.dlbox .row>*{flex:1;justify-content:center}
.ghost{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:10px;font-weight:700}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hero h1 span{opacity:1;transform:none;filter:none}.reveal{opacity:1;transform:none}#stars{display:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <nav>
    <p class="logo"><img src="icon.png" alt="">Expecct</p>
    <a class="pill" href="app/">Open app
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5"/></svg></a>
  </nav>

  <section class="hero">
    <h1><span>Any size.</span><br><span>Any place.</span><br><span class="shine">Your style.</span></h1>
    <div class="ais"><span><i style="background:#10a37f"></i>ChatGPT</span><span><i style="background:#d97757"></i>Claude</span><span><i style="background:#4f8cff"></i>Gemini</span></div>
    <div class="screen" id="screen1"></div>
    <span class="sizetag" id="tag"></span>
  </section>

  <section class="sec reveal">
    <div class="label">14 sizes</div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="sec reveal">
    <div class="label">Style</div>
    <div class="studio">
      <div class="screen" id="screen2"></div>
      <div class="ctrl">
        <input class="field" id="nm" maxlength="20" value="Expecct" aria-label="Name">
        <div class="row" id="accs"></div>
        <div class="row" id="shapes"></div>
      </div>
    </div>
  </section>

  <section class="sec reveal">
    <div class="feats" id="feats"></div>
  </section>

  <section class="sec reveal" id="download">
    <div class="label">Get Expecct</div>
    <div class="webapp">
      <img src="icon.png" alt="">
      <div class="wt"><b>Open in your browser</b><span>Sign-in works · nothing to download · install as an app</span></div>
      <a class="open" href="app/">Open Expecct<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.5M8.5 3.5 13 8l-4.5 4.5"/></svg></a>
    </div>
    <div class="dlor">Or download the desktop app</div>
    <div class="dlgrid" id="dlgrid"></div>
  </section>

  <footer>Expecct</footer>
</div>

<div class="dlhelp" id="dlhelp" hidden role="dialog" aria-modal="true" aria-labelledby="dlt">
  <div class="dlbox">
    <h3 id="dlt"><img src="icon.png" alt="">Downloading…</h3>
    <div class="dlbar"><i></i></div>
    <ol id="dlsteps"></ol>
    <div class="row"><a class="pill" id="dlagain" href="#">Again</a><button class="ghost" id="dlclose">Done</button></div>
  </div>
</div>

<script>
var REL = "https://github.com/rehat2009-dev/exacct-ai/releases/download/latest/";
var TARGET = "";
var SIZES = [["mini","Mini",[73,52,22,40]],["small","Small",[36,16,28,64]],["medium","Medium",[24,10,52,74]],["large","Large",[15,6,70,82]],["xl","Extra large",[6,4,88,88]],["focus","Focus",[15,6,70,84]],["tall","Tall side",[67,0,33,100]],["left","Left half",[0,0,50,100]],["right","Right half",[50,0,50,100]],["left3","Left third",[0,0,33.4,100]],["right3","Right third",[66.6,0,33.4,100]],["top","Top half",[0,0,100,50]],["bottom","Bottom half",[0,50,100,50]],["full","Full screen",[0,0,100,100]]];
var ACC = ["#8b5cf6","#ec4899","#10a37f","#4f8cff","#f59e0b","#ef4444","#06b6d4","#e4e4e7"];
var SHAPES = ["rounded","circle","squircle","diamond"];
var AIS = [["ChatGPT","#10a37f"],["Claude","#d97757"],["Gemini","#4f8cff"]];
var st = { name: "Expecct", shape: "rounded", ai: 0 };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function appHtml(){
  return "<div class=\"dock\"><i></i><i></i><i></i><i></i><i></i></div>" +
    "<div class=\"app\"><div class=\"abar\"><span class=\"aicon " + st.shape + "\"><b>" + esc(st.name.charAt(0) || "E") + "</b></span><span class=\"aname\">" + esc(st.name) + "</span>" +
    "<span class=\"aswitch\">" + AIS.map(function(a, i){ return "<i class=\"" + (i === st.ai ? "on" : "") + "\" style=\"background:" + a[1] + "\"></i>"; }).join("") + "</span></div>" +
    "<div class=\"abody\"><div class=\"msg me\"></div><div class=\"msg w1\"></div><div class=\"msg w2\"></div><div class=\"msg w3\"></div><div class=\"ainput\"></div></div></div>";
}
function buildScreens(){
  $("screen1").innerHTML = appHtml();
  $("screen2").innerHTML = appHtml();
  place($("screen1"), cur, true); place($("screen2"), 3, false);
}
function place(scr, i, label){
  var r = SIZES[i][2], a = scr.querySelector(".app");
  a.style.left = r[0] + "%"; a.style.top = r[1] + "%"; a.style.width = r[2] + "%"; a.style.height = r[3] + "%";
  a.classList.toggle("edge", r[0] === 0 || r[1] === 0 || r[0] + r[2] >= 99.9);
  if (label) $("tag").textContent = SIZES[i][1];
}

/* auto tour of sizes in the hero */
var cur = 2, auto = true, tourOrder = [0,2,7,8,5,13,6,11,3];
var ti = 0;
setInterval(function(){
  if (!auto) return;
  ti = (ti + 1) % tourOrder.length; cur = tourOrder[ti];
  st.ai = (st.ai + 1) % 3;
  updateSwitch(); place($("screen1"), cur, true); markTile();
}, 2400);
function updateSwitch(){ Array.prototype.forEach.call(document.querySelectorAll(".aswitch"), function(s){ Array.prototype.forEach.call(s.children, function(d, i){ d.className = i === st.ai ? "on" : ""; }); }); }

/* tiles */
$("tiles").innerHTML = SIZES.map(function(s, i){
  var r = s[2];
  return "<button class=\"tile\" data-i=\"" + i + "\"><div class=\"scr\"><i style=\"left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%\"></i></div><span>" + s[1] + "</span></button>";
}).join("");
function markTile(){ Array.prototype.forEach.call(document.querySelectorAll(".tile"), function(t){ t.classList.toggle("on", +t.dataset.i === cur); }); }
Array.prototype.forEach.call(document.querySelectorAll(".tile"), function(t){
  var go = function(){ auto = false; cur = +t.dataset.i; place($("screen1"), cur, true); markTile(); clearTimeout(window.__resume); window.__resume = setTimeout(function(){ auto = true; }, 6000); };
  t.onclick = function(){ go(); $("screen1").scrollIntoView({ behavior: "smooth", block: "center" }); };
  t.onmouseenter = go;
});

/* style studio */
$("accs").innerHTML = ACC.map(function(a, i){ return "<button class=\"sw" + (i ? "" : " on") + "\" data-acc=\"" + a + "\" style=\"background:" + a + "\" aria-label=\"Colour\"></button>"; }).join("");
$("shapes").innerHTML = SHAPES.map(function(s, i){ return "<button class=\"chip" + (i ? "" : " on") + "\" data-shape=\"" + s + "\">" + s.charAt(0).toUpperCase() + s.slice(1) + "</button>"; }).join("");
Array.prototype.forEach.call(document.querySelectorAll("[data-acc]"), function(b){ b.onclick = function(){
  document.documentElement.style.setProperty("--accent", b.dataset.acc);
  Array.prototype.forEach.call(document.querySelectorAll("[data-acc]"), function(x){ x.classList.toggle("on", x === b); });
}; });
Array.prototype.forEach.call(document.querySelectorAll("[data-shape]"), function(b){ b.onclick = function(){
  st.shape = b.dataset.shape;
  Array.prototype.forEach.call(document.querySelectorAll("[data-shape]"), function(x){ x.classList.toggle("on", x === b); });
  Array.prototype.forEach.call(document.querySelectorAll(".aicon"), function(x){ x.className = "aicon " + st.shape; });
}; });
$("nm").oninput = function(e){
  st.name = e.target.value || "Expecct";
  Array.prototype.forEach.call(document.querySelectorAll(".aname"), function(x){ x.textContent = st.name; });
  Array.prototype.forEach.call(document.querySelectorAll(".aicon b"), function(x){ x.textContent = st.name.charAt(0); });
};

/* features */
var I = {
  key: "<path d=\"M10.5 2a3.5 3.5 0 0 0-3.4 4.3L2 11.4V14h2.6v-1.6h1.6v-1.6h1.6l1-1A3.5 3.5 0 1 0 10.5 2z\"/>",

  mini: "<rect x=\"1.8\" y=\"2.5\" width=\"12.4\" height=\"11\" rx=\"2\"/><rect x=\"8.3\" y=\"8\" width=\"4.4\" height=\"3.6\" rx=\"1\" fill=\"currentColor\"/>",
  pin: "<path d=\"M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14\"/>",
  swap: "<path d=\"M3 5h9l-2.5-2.5M13 11H4l2.5 2.5\"/>",
  chat: "<path d=\"M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z\"/>",
  cols: "<rect x=\"1.8\" y=\"2.5\" width=\"12.4\" height=\"11\" rx=\"2\"/><path d=\"M6 2.5v11M10 2.5v11\"/>",
  goal: "<circle cx=\"8\" cy=\"8\" r=\"6\"/><circle cx=\"8\" cy=\"8\" r=\"2.5\"/>",

  mic: "<rect x=\"5.5\" y=\"1.8\" width=\"5\" height=\"8\" rx=\"2.5\"/><path d=\"M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.2\"/>",
  click: "<path d=\"M3 2.5l9.5 4.2-4 1.3-1.4 4.2z\"/><path d=\"m9 9 3.5 3.5\"/>"
};
var FEATS = [["chat","Ask all 3"],["cols","Side by side"],["key","Stay signed in"],["swap","Switch AI fast"],["clock","Chat history"],["goal","Daily goal"],["bolt","Saved prompts"],["mini","Mini mode"],["up","Updates itself"],["find","Find in chat"],["click","Right-click ask"],["mic","Voice chat"]];
$("feats").innerHTML = FEATS.map(function(f){ return "<div class=\"feat\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">" + I[f[0]] + "</svg>" + f[1] + "</div>"; }).join("");

/* downloads */
var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
var WIN = "<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M1 3l6-1v6H1zM8 2l7-1v7H8zM1 9h6v6l-6-1zM8 9h7v7l-7-1z\"/></svg>";
var MAC = "<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M11.2 8.5c0-1.6 1.3-2.3 1.3-2.4-.7-1-1.8-1.2-2.2-1.2-.9-.1-1.8.6-2.3.6s-1.2-.5-2-.5C4.9 5 3.8 5.7 3.2 6.8c-1.2 2.1-.3 5.2.9 6.9.6.8 1.2 1.7 2.1 1.7.8 0 1.2-.5 2.2-.5s1.3.5 2.2.5c.9 0 1.5-.9 2-1.7.6-.9.9-1.8.9-1.9 0 0-1.7-.7-1.7-2.8zM9.8 3.7c.5-.6.8-1.4.7-2.2-.7 0-1.5.5-2 1.1-.4.5-.8 1.3-.7 2.1.8.1 1.5-.4 2-1z\"/></svg>";
var tgt = TARGET ? " target=\"_blank\" rel=\"noopener\"" : "";
$("dlgrid").innerHTML = AIS.map(function(a){
  var w = "<a class=\"dl" + (isMac ? "" : " main") + "\" href=\"" + REL + "Expecct-" + a[0] + "-Windows.exe\"" + tgt + ">" + WIN + "Windows</a>";
  var m = "<a class=\"dl" + (isMac ? " main" : "") + "\" href=\"" + REL + "Expecct-" + a[0] + "-Mac.dmg\"" + tgt + ">" + MAC + "Mac</a>";
  return "<div class=\"dcard\" style=\"--c:" + a[1] + "\"><div class=\"dtop\"><img src=\"icon.png\" alt=\"\"><div><b>Expecct</b><small><i></i>" + a[0] + "</small></div></div><div class=\"dls\">" + (isMac ? m + w : w + m) + "</div></div>";
}).join("");
var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (matchMedia("(pointer: coarse)").matches && innerWidth < 820);
var PHONE = "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" aria-hidden=\"true\"><rect x=\"4\" y=\"1.5\" width=\"8\" height=\"13\" rx=\"2\"/><path d=\"M7 12h2\"/></svg>";
var phoneCard = "<div class=\"dcard\" style=\"--c:#8b5cf6\"><div class=\"dtop\"><img src=\"" + document.querySelector(".logo img").getAttribute("src") + "\" alt=\"\"><div><b>Expecct</b><small><i></i>Phone</small></div></div><div class=\"dls\"><a class=\"dl main\" href=\"phone/\">" + PHONE + "Open phone app</a></div></div>";
$("dlgrid").insertAdjacentHTML(isPhone ? "afterbegin" : "beforeend", phoneCard);
if (isPhone) { var nb = document.querySelector("nav .pill"); nb.firstChild.textContent = "Get the app "; nb.setAttribute("href", "phone/"); Array.prototype.forEach.call(document.querySelectorAll(".dl.main"), function(x){ if (x.getAttribute("href") !== "phone/") x.classList.remove("main"); }); }
var STEPS = {
  win: ["Open the file", "<b>More info</b> → <b>Run anyway</b>", "Done – it opens by itself"],
  mac: ["Open the file", "Drag it to <b>Applications</b>", "Blocked? <b>Settings → Privacy &amp; Security → Open Anyway</b>"]
};
/* the file comes as a download, so the page stays here */
function startDownload(url){ window.location.assign(url); }
document.addEventListener("click", function(e){
  var a = e.target.closest("a.dl, #dlagain"); if (!a || a.getAttribute("href") === "phone/") return;
  if (!TARGET) { e.preventDefault(); startDownload(a.href); }
  if (a.id === "dlagain") return;
  $("dlsteps").innerHTML = STEPS[/\.dmg$/.test(a.href) ? "mac" : "win"].map(function(t){ return "<li><span>" + t + "</span></li>"; }).join("");
  $("dlagain").href = a.href; if (TARGET) { $("dlagain").target = "_blank"; $("dlagain").rel = "noopener"; }
  $("dlhelp").hidden = false;
});
$("dlclose").onclick = function(){ $("dlhelp").hidden = true; };
$("dlhelp").addEventListener("click", function(e){ if (e.target.id === "dlhelp") $("dlhelp").hidden = true; });

/* reveal + stars */
var RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
var els = document.querySelectorAll(".reveal");
if (RM || !("IntersectionObserver" in window)) Array.prototype.forEach.call(els, function(e){ e.classList.add("in"); });
else { var io = new IntersectionObserver(function(es){ es.forEach(function(en){ if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }); }, { threshold: .12 }); Array.prototype.forEach.call(els, function(e){ io.observe(e); }); }
if (!RM) {
  var cv = $("stars"), cx = cv.getContext("2d"), W, H, P = [], mx = -999, my = -999;
  var size = function(){ var d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    P = Array.from({ length: Math.round(W * H / 15000) }, function(){ return { x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15, r: Math.random() * 1.3 + .3, t: Math.random() * 6 }; }); };
  size(); addEventListener("resize", size);
  addEventListener("pointermove", function(e){ mx = e.clientX; my = e.clientY; });
  (function loop(){
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) { var p = P[i]; p.x += p.vx; p.y += p.vy; p.t += .02;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      var dx = p.x - mx, dy = p.y - my, dd = Math.hypot(dx, dy); if (dd < 120) { p.x += dx / dd * .8; p.y += dy / dd * .8; }
      cx.globalAlpha = .45 + Math.sin(p.t) * .2; cx.fillStyle = "#d8d4ff"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); }
    requestAnimationFrame(loop);
  })();
}
buildScreens(); markTile();
